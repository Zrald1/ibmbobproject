name: Build Android APK (CI)

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repo is authored on Windows, so gradlew can lose its executable
      # bit in the checkout — without this the step fails with exit code 126.
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # Debug build — no signing secrets needed. The release workflow
      # (.github/workflows/release.yml) handles the signed tag builds.
      - name: Build Android APK (Debug)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: argos-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
