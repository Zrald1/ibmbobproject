name: Release

# Triggered by pushing a version tag, e.g.
#   git tag v1.4.0 && git push origin v1.4.0
# or manually via "Run workflow".
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

# ── Required repository secrets ──────────────────────────────────────────────
# Settings → Secrets and variables → Actions → New repository secret
#
#   ANDROID_KEYSTORE_BASE64     base64 of the release keystore (.keystore file)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias (e.g. argos-key)          [optional]
#   ANDROID_KEY_ALIAS_PASSWORD  key password
#
# Generate ANDROID_KEYSTORE_BASE64 (one line, no wrapping):
#   pwsh scripts/setup-signing-secrets.ps1 -Keystore <path>
#   ./scripts/setup-signing-secrets.sh <path>
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ── Android APK ─────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/argos-release.keystore"
          echo "Keystore written: $(wc -c < "$RUNNER_TEMP/signing/argos-release.keystore") bytes"

      # The repo is authored on Windows, so gradlew can lose its executable
      # bit in the checkout — without this the step fails with exit code 126.
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/argos-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'argos-key' }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is release-signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME"/build-tools/36.0.0/apksigner
          "$APKSIGNER" verify --print-certs "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::APK was signed with the DEBUG key — signing secrets are wrong."
            exit 1
          fi

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk argos-android-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: argos-android-release-apk
          path: argos-android-release.apk
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

  # ── Argos Desktop (Windows) ──────────────────────────────────────────────────
  build-desktop:
    name: Build Argos Desktop (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_INSTALLATION_ROOT"
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
        env:
          VCPKG_INSTALLATION_ROOT: C:\vcpkg

      - name: Configure (CMake + vcpkg)
        shell: pwsh
        working-directory: argos-desktop
        run: |
          cmake --preset default `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build Release
        shell: pwsh
        working-directory: argos-desktop
        run: cmake --build build --config Release --parallel

      - name: Set up Node.js (for IDE bridge packaging)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build & package IDE bridge extension
        shell: pwsh
        working-directory: argos-desktop/extension-ide
        run: |
          npm ci
          npx @vscode/vsce package --allow-missing-repository --out argos-ide-bridge.vsix

      - name: Stage artefacts
        shell: pwsh
        working-directory: argos-desktop
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\argos.exe          dist\
          Copy-Item build\Release\WebView2Loader.dll dist\
          Copy-Item build\Release\assets             dist\assets -Recurse
          # IDE bridge .vsix (built above) and MCP bridge script
          Copy-Item extension-ide\argos-ide-bridge.vsix dist\
          Copy-Item mcp-server\argos_bridge.py          dist\

      - name: Zip desktop build
        shell: pwsh
        working-directory: argos-desktop
        run: |
          Compress-Archive -Path dist\* -DestinationPath ..\argos-desktop-windows-x64.zip

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: argos-desktop-windows-x64
          path: argos-desktop-windows-x64.zip
          retention-days: 90

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-android, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: argos-android-release-apk
          path: artifacts

      - name: Download desktop artifact
        uses: actions/download-artifact@v4
        with:
          name: argos-desktop-windows-x64
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Argos ${{ steps.tag.outputs.tag }}
          body: |
            # Argos ${{ steps.tag.outputs.tag }}

            ## Downloads

            | Asset | Platform | Notes |
            |---|---|---|
            | `argos-android-release.apk` | Android 7.0+ | Sideload — enable "Install unknown apps" |
            | `argos-desktop-windows-x64.zip` | Windows 10/11 x64 | Requires [WebView2 runtime](https://developer.microsoft.com/en-us/microsoft-edge/webview2/) |

            ### Argos Desktop — quick start
            1. Download and extract `argos-desktop-windows-x64.zip`
            2. Run `argos.exe` — the robot overlay appears immediately
            3. Install the IDE bridge: `code --install-extension argos-ide-bridge.vsix`
            4. (Optional) Add the MCP bridge to your CLI agent — see `argos_bridge.py` header

            Release notes are generated automatically below.
          files: |
            artifacts/argos-android-release.apk
            artifacts/argos-desktop-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
