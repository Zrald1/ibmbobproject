name: Release APK

# Triggered by pushing a version tag, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
# or manually via "Run workflow".
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

# ── Required repository secrets ──────────────────────────────────────────
# Settings → Secrets and variables → Actions → New repository secret
#
#   ANDROID_KEYSTORE_BASE64     base64 of the release keystore (.keystore file)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias (e.g. argos-key)          [optional]
#   ANDROID_KEY_ALIAS_PASSWORD  key password
#
# Generate ANDROID_KEYSTORE_BASE64 (one line, no wrapping):
#   pwsh scripts/setup-signing-secrets.ps1 -Keystore <path>
#   ./scripts/setup-signing-secrets.sh <path>
# ─────────────────────────────────────────────────────────────────────────

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/argos-release.keystore"
          echo "Keystore written: $(wc -c < "$RUNNER_TEMP/signing/argos-release.keystore") bytes"

      # The repo is authored on Windows, so gradlew can lose its executable
      # bit in the checkout — without this the step fails with exit code 126.
      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: android
        env:
          # Absolute path — app/build.gradle resolves it with file(), which is
          # relative to the app module dir, so a relative path here would miss.
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/argos-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'argos-key' }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is release-signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME"/build-tools/36.0.0/apksigner
          "$APKSIGNER" verify --print-certs "$APK"
          # Fail the build if it fell back to the debug key
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::APK was signed with the DEBUG key — signing secrets are wrong."
            exit 1
          fi

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk argos-android-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: argos-android-release-apk
          path: argos-android-release.apk
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: argos-android-release-apk
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Argos ${{ steps.tag.outputs.tag }}
          body: |
            # Argos ${{ steps.tag.outputs.tag }}

            ## Download
            - **Android APK** — `argos-android-release.apk` (sideload on your phone)

            Release notes are generated automatically below.
          files: artifacts/argos-android-release.apk
          draft: false
          prerelease: false
          generate_release_notes: true
