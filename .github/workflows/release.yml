name: Release Builds

# Triggered by pushing a version tag, e.g.
#   git tag v3.34.0 && git push origin v3.34.0
# or manually via "Run workflow".
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.34.0)'
        required: true
        default: 'v3.34.0'

permissions:
  contents: write

# ── Required repository secrets ──────────────────────────────────────────
# Settings → Secrets and variables → Actions → New repository secret
#
#   ANDROID_KEYSTORE_BASE64     base64 of the release keystore (.keystore file)
#   ANDROID_KEYSTORE_PASSWORD   keystore password
#   ANDROID_KEY_ALIAS           key alias (e.g. argos-key)          [optional]
#   ANDROID_KEY_ALIAS_PASSWORD  key password
#
#   GOOGLE_PLAY_SERVICE_ACCOUNT Play service-account JSON (optional — the
#                               Play upload step is skipped when absent)
#
# Generate ANDROID_KEYSTORE_BASE64 (one line, no wrapping):
#   Linux/macOS : base64 -w0 argos-release.keystore
#   Windows PS  : [Convert]::ToBase64String([IO.File]::ReadAllBytes("argos-release.keystore"))
# ─────────────────────────────────────────────────────────────────────────

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 cmake;3.22.1 ndk;27.0.12077973'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/argos-release.keystore"
          echo "Keystore written: $(wc -c < "$RUNNER_TEMP/signing/argos-release.keystore") bytes"

      - name: Build Android APK (Release)
        working-directory: android
        env:
          # Absolute path — app/build.gradle resolves it with file(), which is
          # relative to the app module dir, so a relative path here would miss.
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/argos-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'argos-key' }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Android AAB (Release)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/argos-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'argos-key' }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify the APK is release-signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK"
          # Fail the build if it fell back to the debug key
          if "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::APK was signed with the DEBUG key — signing secrets are wrong."
            exit 1
          fi

      - name: Rename artifacts
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk argos-android-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab argos-android-release.aab

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: argos-android-release-apk
          path: argos-android-release.apk
          retention-days: 90

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: argos-android-release-aab
          path: argos-android-release.aab
          retention-days: 90

      - name: Clean up keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -laR artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Argos ${{ steps.tag.outputs.tag }}
          body: |
            # Argos ${{ steps.tag.outputs.tag }}

            ## Downloads
            - **Android APK** — `argos-android-release.apk` (sideload on your phone)
            - **Android AAB** — `argos-android-release.aab` (Google Play bundle)

            Release notes are generated automatically below.
          files: |
            artifacts/argos-android-release-apk/argos-android-release.apk
            artifacts/argos-android-release-aab/argos-android-release.aab
          draft: false
          prerelease: false
          generate_release_notes: true

  publish-play:
    # Only runs when the Play service-account secret is configured.
    needs: [build-android]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check for Play credentials
        id: check
        env:
          SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "No GOOGLE_PLAY_SERVICE_ACCOUNT secret — skipping Play upload."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Download AAB artifact
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          name: argos-android-release-aab
          path: artifacts

      - name: Write service account JSON
        if: steps.check.outputs.skip == 'false'
        env:
          GCP_SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
        run: |
          printenv GCP_SA_JSON > service-account.json
          if ! grep -q '{' service-account.json 2>/dev/null; then
            base64 -d service-account.json > service-account-decoded.json
            mv service-account-decoded.json service-account.json
          fi
          python3 -c "import json; d=json.load(open('service-account.json')); print('Valid JSON, email:', d.get('client_email','?'))"

      - name: Upload AAB to Google Play (internal testing)
        if: steps.check.outputs.skip == 'false'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service-account.json
          packageName: com.example.argos
          releaseFiles: artifacts/argos-android-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: 3
          changesNotSentForReview: false
