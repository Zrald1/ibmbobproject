plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.argos'
    compileSdk 36
    ndkVersion '27.0.12077973'

    // Release signing config.
    //
    // Credentials are NEVER committed to the repository. They are read from
    // (in order):
    //   1. Environment variables — for CI:
    //        ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD,
    //        ANDROID_KEY_ALIAS, ANDROID_KEY_ALIAS_PASSWORD
    //   2. android/local.properties — git-ignored, for local builds:
    //        argos.keystore=../app/argos-release.keystore
    //        argos.keystorePassword=...
    //        argos.keyAlias=argos-key
    //        argos.keyAliasPassword=...
    //
    // If no credentials are configured, the release build falls back to the
    // debug signing key (see buildTypes.release) so it still produces an APK.
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('local.properties')
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH") ?: props.getProperty('argos.keystore')
            def keystorePwd = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: props.getProperty('argos.keystorePassword')
            def alias = System.getenv("ANDROID_KEY_ALIAS") ?: props.getProperty('argos.keyAlias') ?: 'argos-key'
            def aliasPwd = System.getenv("ANDROID_KEY_ALIAS_PASSWORD") ?: props.getProperty('argos.keyAliasPassword')

            if (keystorePath != null && file(keystorePath).exists() && keystorePwd != null && aliasPwd != null) {
                storeFile file(keystorePath)
                storePassword keystorePwd
                keyAlias alias
                keyPassword aliasPwd
            } else if (file('argos-release.keystore').exists()) {
                println "WARNING: argos-release.keystore found but no signing credentials configured."
                println "         Set ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS_PASSWORD, or add"
                println "         argos.keystorePassword / argos.keyAliasPassword to android/local.properties."
                println "         Falling back to the debug signing key."
            }
        }
    }

    defaultConfig {
        applicationId "com.example.argos"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions -frtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use release keystore if available, fall back to debug
            try {
                if (signingConfigs.release.storeFile != null) {
                    signingConfig signingConfigs.release
                } else {
                    signingConfig signingConfigs.debug
                }
            } catch (Exception e) {
                signingConfig signingConfigs.debug
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 16 KB page size: compress .so files in APK so prebuilt libraries
    // (MediaPipe, ML Kit) don't need 16 KB zip alignment.
    // This is the recommended approach for AGP < 8.5.1 or when using
    // prebuilt .so files that aren't 16 KB aligned.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // Don't compress MediaPipe model files in APK
    androidResources {
        noCompress 'task'
    }

    // Mock Android framework calls (Log, etc.) for unit tests
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // ML Kit Text Recognition for OCR — using UNBUNDLED version (play-services)
    // The bundled version (com.google.mlkit:text-recognition) ships .so files
    // that are NOT 16 KB aligned. The unbundled version downloads models via
    // Google Play Services and doesn't bundle .so files in the APK.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    // EncryptedSharedPreferences for secure token storage
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    // CameraX for camera hand tracking — 1.4.2+ has 16 KB aligned .so files
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    // MediaPipe Tasks Vision — 0.10.29+ has 16 KB aligned .so files
    implementation 'com.google.mediapipe:tasks-vision:0.10.29'
    // Concurrent futures for CameraX (provides ListenableFuture)
    implementation 'androidx.concurrent:concurrent-futures:1.2.0'

    // ── Test dependencies ──
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
