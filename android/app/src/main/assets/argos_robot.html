            targetLeftEyeScaleX = 0.8; targetLeftEyeScaleY = 0.15;
            targetRightEyeScaleX = 0.8; targetRightEyeScaleY = 0.15;
            targetLeftEyePosY = 0.15; targetRightEyePosY = 0.15;
            // Small "oops" mouth
            targetMouthScaleX = 0.3; targetMouthScaleY = 0.3;
            targetMouthPosY = -0.42; targetMouthRotation = 0;
            targetHeadTilt = 0; targetHeadTiltZ = 0;
            targetGlowOpacity = 0.15;
            targetEyeColor.setHex(0xff8800);
            targetMouthColor.setHex(0xff8800);
            // Hands cover eyes for privacy — override gesture
            handsVisible = true;
            leftHandTargetX = -0.85; leftHandTargetY = -1.35; leftHandTargetZ = 0.9;
            leftHandTargetRotX = 0; leftHandTargetRotY = 0; leftHandTargetRotZ = 0;
            rightHandTargetX = 0.85; rightHandTargetY = -1.35; rightHandTargetZ = 0.9;
            rightHandTargetRotX = 0; rightHandTargetRotY = 0; rightHandTargetRotZ = 0;
            break;

        case EXPRESSIONS.LAUGHING:
            // Squinted eyes (Duchenne smile), mouth will pulse in animation loop
            targetLeftEyeScaleX = 1.2; targetLeftEyeScaleY = 0.12;
            targetRightEyeScaleX = 1.2; targetRightEyeScaleY = 0.12;
            targetLeftEyePosY = 0.25; targetRightEyePosY = 0.25;
            // Mouth base — will be overridden by rhythmic pulse in animation loop
            targetMouthScaleX = 1.5; targetMouthScaleY = 1.0;
            targetMouthPosY = -0.38; targetMouthRotation = 0;
            // Head tilted back — will bounce in animation loop
            targetHeadTilt = -0.15; targetHeadTiltZ = 0;
            targetGlowOpacity = 0.6;
            targetEyeColor.setHex(0x00ff99);
            targetMouthColor.setHex(0x00ff99);
            break;
    }
}

// ── Touch handling ──
let touchStartX = 0, touchStartY = 0, touchDown = false;
let longPressTimer = null;
let longPressFired = false;

canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    touchDown = true;
    isDragging = false;
    longPressFired = false;
    if (window.JSBridge) JSBridge.onTouchDown(t.clientX, t.clientY);
    // Notify user activity — keeps robot dancing
    if (window.ArgosJS) ArgosJS.onUserActivity();
    // Start long-press timer (600ms)
    longPressTimer = setTimeout(function() {
        if (!isDragging && touchDown) {
            longPressFired = true;
            if (window.JSBridge) JSBridge.onLongPress(t.clientX, t.clientY);
        }
    }, 600);
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    const t = e.touches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) > 15 || Math.abs(dy) > 15) {
        isDragging = true;
        // Cancel long press if moved
        if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }
    if (window.JSBridge) JSBridge.onTouchMove(t.clientX, t.clientY, isDragging);
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    touchDown = false;
    // Cancel long-press timer
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    // If long press already fired, don't process tap
    if (longPressFired) return;

    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (isDragging) {
        isDragging = false;
        if (window.JSBridge) JSBridge.onDragEnd();
    } else if (dist < 30) {
        // Any tap on head = head tap
        const canvasRect = canvas.getBoundingClientRect();
        const localX = t.clientX - canvasRect.left;
        const localY = t.clientY - canvasRect.top;
        const cx = canvasRect.width / 2;
        const cy = canvasRect.height / 2;
        const dxTap = localX - cx;
        const dyTap = localY - cy;
        const tapDist = Math.sqrt(dxTap * dxTap + dyTap * dyTap);
        if (tapDist < canvasRect.width * 0.5) {
            if (window.JSBridge) JSBridge.onHeadTap();
        }
    }
}, { passive: false });

// ── Animation helpers ──
function pickNextBehavior() {
    // In standby mode, don't auto-move — just idle with occasional expressions
    if (standbyMode) {
        currentState = STATES.IDLE;
        stateDuration = 5 + Math.random() * 5;
        if (Math.random() < 0.3) {
            currentExpression = EXPRESSIONS.SLEEPING;
        } else {
            currentExpression = EXPRESSIONS.NEUTRAL;
        }
        updateExpression();
        return;
    }
    // If user is active, favor dancing
    if (userActive && (animTime - lastActivityTime) < ACTIVITY_TIMEOUT) {
        if (currentState !== STATES.DANCING) {
            currentState = STATES.DANCING;
            danceBeatTimer = 0;
            danceMoveIndex = 0;
            currentExpression = EXPRESSIONS.EXCITED;
            updateExpression();
        }
        return;
    }
    const roll = Math.random();
    if (roll < 0.08) {
        currentState = STATES.GREETING;
        stateDuration = 1.5;
        currentExpression = EXPRESSIONS.HAPPY;
    } else if (roll < 0.55) {
        // Walk to a random edge (edge-to-edge roaming)
        walkRandomEdge();
    } else if (roll < 0.70) {
        // Spin then walk to a random edge
        startSpinThenWalkRandomEdge();
    } else {
        currentState = STATES.IDLE;
        stateDuration = 2 + Math.random() * 3;
        currentExpression = EXPRESSIONS.NEUTRAL;
    }
    updateExpression();
}

function walkRandomEdge() {
    // Pick the opposite edge from where the robot currently is, with a
    // random vertical position — this gives edge-to-edge roaming.
    const margin = robotSize * 1.5;
    const onLeftSide = robotScreenX < screenWidth / 2;
    walkTargetX = onLeftSide
        ? screenWidth - margin            // head to the right edge
        : margin;                         // head to the left edge
    // Occasionally pick the same side but different Y
    if (Math.random() < 0.2) {
        walkTargetX = onLeftSide ? margin : screenWidth - margin;
    }
    // Random Y across the upper/middle portion of the screen
    let maxY = screenHeight * 0.65;
    if (keyboardVisible && keyboardTopY > 0) {
        maxY = keyboardTopY - robotSize * 0.5;
    }
    walkTargetY = margin + Math.random() * (maxY - margin);
    facingRight = walkTargetX > robotScreenX;
    currentState = STATES.WALKING;
    stateDuration = 999;
}

function startSpinThenWalkRandomEdge() {
    spinTimer = 0;
    const margin = robotSize * 1.5;
    const onLeftSide = robotScreenX < screenWidth / 2;
    walkTargetX = onLeftSide ? screenWidth - margin : margin;
    let maxY = screenHeight * 0.65;
    if (keyboardVisible && keyboardTopY > 0) {
        maxY = keyboardTopY - robotSize * 0.5;
    }
    walkTargetY = margin + Math.random() * (maxY - margin);
    facingRight = walkTargetX > robotScreenX;
    currentState = STATES.SPINNING;
    stateDuration = spinDuration;
}

function walkToEdge(left) {
    const margin = robotSize * 1.5;
    walkTargetX = left ? margin : screenWidth - margin;
    walkTargetY = robotScreenY; // Keep same Y
    facingRight = !left;
    currentState = STATES.WALKING;
    stateDuration = 999;
}

function walkToPosition(x, y) {
    walkTargetX = x;
    walkTargetY = y;
    facingRight = x > robotScreenX;
    currentState = STATES.WALKING;
    stateDuration = 999;
}

function startSpinThenWalk(left) {
    spinTimer = 0;
    const margin = robotSize * 1.5;
    walkTargetX = left ? margin : screenWidth - margin;
    walkTargetY = robotScreenY;
    facingRight = !left;
    currentState = STATES.SPINNING;
    stateDuration = spinDuration;
}

function startSpinThenWalkRandom() {
    spinTimer = 0;
    const margin = robotSize * 1.5;
    walkTargetX = margin + Math.random() * (screenWidth - margin * 2);
    walkTargetY = margin + Math.random() * (screenHeight * 0.6);
    facingRight = walkTargetX > robotScreenX;
    currentState = STATES.SPINNING;
    stateDuration = spinDuration;
}

// ── Smooth interpolation helper ──
function lerp(current, target, speed) {
    return current + (target - current) * speed;
}

// ── Main animation loop ──
let lastTime = performance.now();

function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    let dt = (now - lastTime) / 1000;
    lastTime = now;
    if (dt > 0.1) dt = 0.016;
    animTime += dt;
    stateTimer += dt;

    const lerpSpeed = 8 * dt;

    // ── Idle bobbing ──
    const bob = Math.sin(animTime * 1.8) * 0.06;
    robot.position.y = bob;

    // ── Blink logic ──
    blinkTimer -= dt;
    if (blinkTimer <= 0 && !isBlinking && currentExpression !== EXPRESSIONS.SLEEPING) {
        isBlinking = true;
        blinkDuration = 0.12;
        blinkTimer = 2.5 + Math.random() * 4;
        // Force blink
        targetLeftEyeScaleY = 0.05;
        targetRightEyeScaleY = 0.05;
    }
    if (isBlinking) {
        blinkDuration -= dt;
        if (blinkDuration <= 0) {
            isBlinking = false;
            updateExpression(); // Restore expression after blink
        }
    }

    // ── 180-degree turn animation (look at screen) ──
    if (isTurning) {
        turnTimer += dt;
        if (turnPhase === 0) {
            // Turning to face screen (0 -> PI)
            var t = Math.min(turnTimer / turnDuration, 1.0);
            var eased = t * t * (3 - 2 * t); // smoothstep
            robot.rotation.y = eased * Math.PI;
            // Lens scanning effect
            lens.material.opacity = 0.5 + Math.sin(animTime * 8) * 0.3;
            lensRing.material.opacity = 0.3 + Math.sin(animTime * 6) * 0.2;
            antennaTip.material.color.setHex(0x00ff99);
            if (t >= 1.0) {
                turnPhase = 1;
                turnTimer = 0;
            }
        } else if (turnPhase === 1) {
            // Holding — looking at screen
            robot.rotation.y = Math.PI;
            // Scanning lens pulse
            lens.material.opacity = 0.6 + Math.sin(animTime * 10) * 0.3;
            lensRing.material.opacity = 0.4 + Math.sin(animTime * 8) * 0.2;
            // Antenna tip blinks
            antennaTip.material.color.setHex(
                Math.sin(animTime * 5) > 0 ? 0x00ff99 : 0x004433
            );
            if (turnTimer >= turnHoldDuration) {
                turnPhase = 2;
                turnTimer = 0;
            }
        } else if (turnPhase === 2) {
            // Turning back to face user (PI -> 0)
            var t2 = Math.min(turnTimer / turnDuration, 1.0);
            var eased2 = t2 * t2 * (3 - 2 * t2);
            robot.rotation.y = Math.PI * (1 - eased2);
            lens.material.opacity = 0.8 * (1 - t2);
            lensRing.material.opacity = 0.5 * (1 - t2);
            if (t2 >= 1.0) {
                isTurning = false;
                turnPhase = 0;
                robot.rotation.y = 0;
                lens.material.opacity = 0.8;
                lensRing.material.opacity = 0.5;
                antennaTip.material.color.setHex(0x00e5cc);
            }
        }
    }

    // ── Sequential expression system ──
    if (sequenceActive && expressionSequence.length > 0) {
        sequenceTimer += dt;
        var currentStep = expressionSequence[sequenceIndex];
        if (currentStep && sequenceTimer >= (currentStep.duration || 1.0)) {
            sequenceIndex++;
            sequenceTimer = 0;
            if (sequenceIndex >= expressionSequence.length) {
                // Sequence complete
                sequenceActive = false;
                currentExpression = EXPRESSIONS.NEUTRAL;
                updateExpression();
            } else {
                // Apply next expression (case-insensitive)
                var next = expressionSequence[sequenceIndex];
                if (next.expr) {
                    var upper = String(next.expr).toUpperCase().trim();
                    if (EXPRESSIONS[upper]) {
                        currentExpression = EXPRESSIONS[upper];
                        updateExpression();
                    }
                }
            }
        }
    }

    // ── Smooth eye interpolation ──
    leftEye.scale.x = lerp(leftEye.scale.x, targetLeftEyeScaleX, lerpSpeed);
    leftEye.scale.y = lerp(leftEye.scale.y, targetLeftEyeScaleY, lerpSpeed);
    leftEye.position.y = lerp(leftEye.position.y, targetLeftEyePosY, lerpSpeed);
    rightEye.scale.x = lerp(rightEye.scale.x, targetRightEyeScaleX, lerpSpeed);
    rightEye.scale.y = lerp(rightEye.scale.y, targetRightEyeScaleY, lerpSpeed);
    rightEye.position.y = lerp(rightEye.position.y, targetRightEyePosY, lerpSpeed);

    // ── Smooth mouth interpolation ──
    mouth.scale.x = lerp(mouth.scale.x, targetMouthScaleX, lerpSpeed);
    mouth.scale.y = lerp(mouth.scale.y, targetMouthScaleY, lerpSpeed);
    mouth.position.y = lerp(mouth.position.y, targetMouthPosY, lerpSpeed);
    mouth.rotation.z = lerp(mouth.rotation.z, targetMouthRotation, lerpSpeed);

    // ── Smooth head tilt ──
    robot.rotation.x = lerp(robot.rotation.x, targetHeadTilt, lerpSpeed);
    robot.rotation.z = lerp(robot.rotation.z, targetHeadTiltZ, lerpSpeed);

    // ── Floating hands interpolation ──
    var handLerpSpeed = 6 * dt;
    leftHand.position.x = lerp(leftHand.position.x, leftHandTargetX, handLerpSpeed);
    leftHand.position.y = lerp(leftHand.position.y, leftHandTargetY, handLerpSpeed);
    leftHand.position.z = lerp(leftHand.position.z, leftHandTargetZ, handLerpSpeed);
    leftHand.rotation.x = lerp(leftHand.rotation.x, leftHandTargetRotX, handLerpSpeed);
    leftHand.rotation.y = lerp(leftHand.rotation.y, leftHandTargetRotY, handLerpSpeed);
    leftHand.rotation.z = lerp(leftHand.rotation.z, leftHandTargetRotZ, handLerpSpeed);

    rightHand.position.x = lerp(rightHand.position.x, rightHandTargetX, handLerpSpeed);
    rightHand.position.y = lerp(rightHand.position.y, rightHandTargetY, handLerpSpeed);
    rightHand.position.z = lerp(rightHand.position.z, rightHandTargetZ, handLerpSpeed);
    rightHand.rotation.x = lerp(rightHand.rotation.x, rightHandTargetRotX, handLerpSpeed);
    rightHand.rotation.y = lerp(rightHand.rotation.y, rightHandTargetRotY, handLerpSpeed);
    rightHand.rotation.z = lerp(rightHand.rotation.z, rightHandTargetRotZ, handLerpSpeed);

    // ── Sync hands group with robot position/scale (but NOT rotation) ──
    // This ensures hands always face the camera and appear in front of the
    // robot, even when the robot spins or turns 180° to look at the screen.
    handsGroup.position.copy(robot.position);
    handsGroup.scale.copy(robot.scale);

    // Hand visibility — fade in/out
    var handTargetOpacity = handsVisible ? 0.9 : 0.0;
    var handGlowTarget = handsVisible ? 0.25 : 0.0;
    handMat.opacity = lerp(handMat.opacity, handTargetOpacity, handLerpSpeed);
    handGlowMat.opacity = lerp(handGlowMat.opacity, handGlowTarget, handLerpSpeed);

    // ── Finger curl interpolation ──
    // Smoothly interpolate each finger's curl toward its target, then apply
    // the curl as rotation on the proximal and distal joint groups.
    // Proximal rotates ~70% of full curl, distal rotates ~90% — matching
    // anatomical DIP/PIP joint ratios for natural-looking finger bending.
    var curlLerp = 8 * dt;
    for (var fi = 0; fi < 4; fi++) {
        currentFingerCurl[fi] = lerp(currentFingerCurl[fi], targetFingerCurl[fi], curlLerp);
    }
    currentThumbCurl = lerp(currentThumbCurl, targetThumbCurl, curlLerp);

    // Apply curl to both hands (left + right have identical finger structure)
    var hands = [leftHand, rightHand];
    for (var hi = 0; hi < 2; hi++) {
        var hand = hands[hi];
        var fingers = hand.userData.fingers;
        if (fingers) {
            for (var fi = 0; fi < fingers.length; fi++) {
                var curl = currentFingerCurl[fi];
                // Proximal joint — curls forward (negative X rotation = forward)
                fingers[fi].rotation.x = -curl * 1.4;
                // Distal joint — curls a bit more for a natural curve
                var distal = fingers[fi].userData.distalGroup;
                if (distal) distal.rotation.x = -curl * 1.8;
            }
        }
        // Thumb curl
        var thumb = hand.userData.thumb;
        if (thumb) {
            thumb.base.rotation.x = -currentThumbCurl * 1.0;
            thumb.distal.rotation.x = -currentThumbCurl * 1.4;
        }
    }

    // Hand-specific idle motions based on expression
    if (handsVisible) {
        if (currentExpression === EXPRESSIONS.LAUGHING) {
            // Laugh rhythm — ~5Hz pulse (research: laughter pulses 4-6 Hz)
            var laughFreq = 5.0;
            var laughPulse = Math.sin(animTime * laughFreq * Math.PI * 2);
            var laughAbs = Math.abs(laughPulse); // 0->1->0 per cycle

            // Mouth opens and closes rhythmically — main element of laugh
            mouth.scale.y = 1.0 + laughAbs * 1.8; // closed -> wide open
            mouth.scale.x = 1.5 + laughAbs * 0.3;
            mouth.position.y = -0.38 + laughAbs * 0.05; // shifts up when open

            // Eyes move up when mouth opens, down when it closes (synced)
            leftEye.position.y = 0.25 + laughAbs * 0.06;
            rightEye.position.y = 0.25 + laughAbs * 0.06;
            // Eyes squint tighter on each laugh pulse
            leftEye.scale.y = 0.12 + (1 - laughAbs) * 0.08;
            rightEye.scale.y = 0.12 + (1 - laughAbs) * 0.08;

            // Head bounces back and forth — tilts further back on each pulse
            robot.rotation.x = -0.15 - laughAbs * 0.12;
            // Slight forward nod between pulses
            robot.position.y = bob + laughAbs * 0.08;

            // Body shake — subtle z-axis vibration
            robot.rotation.z = Math.sin(animTime * laughFreq * Math.PI) * 0.03;

            // Hands bounce in sync with mouth — belly-hold pushing in on each laugh
            leftHand.position.y = leftHandTargetY + laughAbs * 0.06;
            rightHand.position.y = rightHandTargetY + laughAbs * 0.06;
            leftHand.rotation.z = leftHandTargetRotZ + laughAbs * 0.08;
            rightHand.rotation.z = rightHandTargetRotZ - laughAbs * 0.08;
            // Hands push toward belly on each pulse
            leftHand.position.z = leftHandTargetZ + laughAbs * 0.05;
            rightHand.position.z = rightHandTargetZ + laughAbs * 0.05;
        } else if (currentExpression === EXPRESSIONS.HAPPY) {
            // Waving — alternate up/down
            leftHand.position.y = leftHandTargetY + Math.sin(animTime * 4) * 0.12;
            rightHand.position.y = rightHandTargetY + Math.sin(animTime * 4 + Math.PI) * 0.12;
        } else if (currentExpression === EXPRESSIONS.EXCITED) {
            // Cheering — fast up/down both hands
            leftHand.position.y = leftHandTargetY + Math.sin(animTime * 7) * 0.1;
            rightHand.position.y = rightHandTargetY + Math.sin(animTime * 7) * 0.1;
        } else if (currentExpression === EXPRESSIONS.ANGRY) {
            // Shaking fists
            leftHand.position.x = leftHandTargetX + Math.sin(animTime * 10) * 0.04;
            rightHand.position.x = rightHandTargetX - Math.sin(animTime * 10) * 0.04;
        } else if (currentExpression === EXPRESSIONS.SCARED) {
            // Trembling hands
            leftHand.position.x = leftHandTargetX + Math.sin(animTime * 15) * 0.03;
            rightHand.position.x = rightHandTargetX - Math.sin(animTime * 15) * 0.03;
            leftHand.position.y = leftHandTargetY + Math.cos(animTime * 12) * 0.03;
            rightHand.position.y = rightHandTargetY + Math.cos(animTime * 12) * 0.03;
        } else if (currentExpression === EXPRESSIONS.HIDING_EYES) {
            // Hands covering eyes — slight breathing/tremble, hands pressed against face
            leftHand.position.x = leftHandTargetX + Math.sin(animTime * 2) * 0.01;
            rightHand.position.x = rightHandTargetX - Math.sin(animTime * 2) * 0.01;
            leftHand.position.y = leftHandTargetY + Math.sin(animTime * 1.5) * 0.015;
            rightHand.position.y = rightHandTargetY + Math.sin(animTime * 1.5) * 0.015;
            // Slight head shake "no no no"
            robot.rotation.z = Math.sin(animTime * 3) * 0.03;
        } else if (currentExpression === EXPRESSIONS.SAD) {
            // Slow sway
            leftHand.rotation.z = leftHandTargetRotZ + Math.sin(animTime * 1.5) * 0.06;
            rightHand.rotation.z = rightHandTargetRotZ - Math.sin(animTime * 1.5) * 0.06;
        } else if (currentExpression === EXPRESSIONS.LOVE) {
            // Gentle pulse toward head
            leftHand.position.z = leftHandTargetZ + Math.sin(animTime * 3) * 0.05;
            rightHand.position.z = rightHandTargetZ + Math.sin(animTime * 3) * 0.05;
        } else if (currentExpression === EXPRESSIONS.THINKING) {
            // Hand on chin — slight tap/stroke
            leftHand.position.y = leftHandTargetY + Math.sin(animTime * 2) * 0.03;
            leftHand.rotation.z = leftHandTargetRotZ + Math.sin(animTime * 1.5) * 0.05;
        } else if (currentExpression === EXPRESSIONS.WINK) {
            // Playful hand — slight wave near face
            leftHand.position.y = leftHandTargetY + Math.sin(animTime * 3) * 0.05;
            leftHand.rotation.z = leftHandTargetRotZ + Math.sin(animTime * 2) * 0.08;
        } else if (currentExpression === EXPRESSIONS.CONFUSED) {
            // Hand on head — scratch motion
            leftHand.position.x = leftHandTargetX + Math.sin(animTime * 4) * 0.03;
            leftHand.rotation.z = leftHandTargetRotZ + Math.sin(animTime * 3) * 0.06;
            rightHand.position.y = rightHandTargetY + Math.sin(animTime * 2) * 0.04;
        } else if (currentExpression === EXPRESSIONS.DIZZY) {
            // Both hands on head — wobble
            leftHand.position.x = leftHandTargetX + Math.sin(animTime * 3) * 0.04;
            rightHand.position.x = rightHandTargetX - Math.sin(animTime * 3) * 0.04;
            leftHand.rotation.z = leftHandTargetRotZ + Math.sin(animTime * 2) * 0.06;
            rightHand.rotation.z = rightHandTargetRotZ - Math.sin(animTime * 2) * 0.06;
        } else if (currentExpression === EXPRESSIONS.STAR_EYES) {
            // Hands raised — subtle trembling with awe
            leftHand.position.y = leftHandTargetY + Math.sin(animTime * 3) * 0.04;
            rightHand.position.y = rightHandTargetY + Math.sin(animTime * 3) * 0.04;
        } else if (currentExpression === EXPRESSIONS.SURPRISED) {
            // Hands on cheeks — slight shake
            leftHand.position.x = leftHandTargetX + Math.sin(animTime * 8) * 0.02;
            rightHand.position.x = rightHandTargetX - Math.sin(animTime * 8) * 0.02;
        }
    }

    // ── Laughing tear animation (tears of joy) ──
    if (currentExpression === EXPRESSIONS.LAUGHING) {
        tearTimer += dt;
        if (tearPhase === 0) {
            // Forming — tear appears at eye corner, grows
            var formT = Math.min(tearTimer / 0.5, 1.0);
            leftTear.material.opacity = formT * 0.8;
            rightTear.material.opacity = formT * 0.8;
            leftTear.position.set(-0.55, 0.0 - formT * 0.05, 0.9);
            rightTear.position.set(0.55, 0.0 - formT * 0.05, 0.9);
            leftTear.scale.setScalar(0.5 + formT * 0.8);
            rightTear.scale.setScalar(0.5 + formT * 0.8);
            if (tearTimer >= 0.5) {
                tearPhase = 1;
                tearTimer = 0;
            }
        } else if (tearPhase === 1) {
            // Falling — tear drops down with gravity
            var fallT = tearTimer / 1.0;
            leftTear.position.y = -0.05 - fallT * 1.2;
            rightTear.position.y = -0.05 - fallT * 1.2;
            leftTear.material.opacity = 0.8 * (1 - fallT * 0.7);
            rightTear.material.opacity = 0.8 * (1 - fallT * 0.7);
            leftTear.scale.setScalar(1.3 - fallT * 0.3);
            rightTear.scale.setScalar(1.3 - fallT * 0.3);
            if (tearTimer >= 1.0) {
                tearPhase = 2;
                tearTimer = 0;
            }
        } else if (tearPhase === 2) {
            // Gone — brief pause then restart
            leftTear.material.opacity = 0;
            rightTear.material.opacity = 0;
            if (tearTimer >= 0.3) {
                tearPhase = 0;
                tearTimer = 0;
            }
        }
    } else {
        // Fade out tears when not laughing
        leftTear.material.opacity = lerp(leftTear.material.opacity, 0, lerpSpeed);
        rightTear.material.opacity = lerp(rightTear.material.opacity, 0, lerpSpeed);
        tearPhase = 0;
        tearTimer = 0;
    }

    // ── Glow opacity ──
    leftGlow.material.opacity = lerp(leftGlow.material.opacity, targetGlowOpacity, lerpSpeed);
    rightGlow.material.opacity = lerp(rightGlow.material.opacity, targetGlowOpacity, lerpSpeed);
    mouthGlow.material.opacity = lerp(mouthGlow.material.opacity, targetGlowOpacity * 0.6, lerpSpeed);

    // ── Eye and mouth color interpolation ──
    currentEyeColor.lerp(targetEyeColor, lerpSpeed);
    currentMouthColor.lerp(targetMouthColor, lerpSpeed);
    leftEye.material.color.copy(currentEyeColor);
    rightEye.material.color.copy(currentEyeColor);
    mouth.material.color.copy(currentMouthColor);
    leftGlow.material.color.copy(currentEyeColor);
    rightGlow.material.color.copy(currentEyeColor);
    mouthGlow.material.color.copy(currentMouthColor);

    // ── State animations ──
    switch (currentState) {
        case STATES.IDLE:
            // Gentle sway
            robot.rotation.y = Math.sin(animTime * 1.2) * 0.05;
            break;

        case STATES.GREETING:
            // Happy bounce
            robot.position.y = bob + Math.abs(Math.sin(animTime * 4)) * 0.08;
            robot.rotation.y = Math.sin(animTime * 2) * 0.08;
            break;

        case STATES.WALKING:
            if (!isDragging) {
                // Slight tilt while moving
                robot.rotation.z = facingRight ? 0.03 : -0.03;
                robot.rotation.y = facingRight ? 0.1 : -0.1;
                // Bouncing
                robot.position.y = bob + Math.abs(Math.sin(animTime * 6)) * 0.05;
            }
            break;

        case STATES.THINKING:
            // Thinking dots animation
            const dotPhase = Math.floor(animTime * 3) % 3;
            thinkingGroup.children.forEach((dot, i) => {
                dot.material.opacity = (i === dotPhase) ? 1.0 : 0.3;
                dot.position.y = (i === dotPhase) ? 0.06 : 0;
            });
            // Floating particles
            particleMat.opacity = 0.5;
            // Eyes scan side to side (thinking look)
            leftEye.position.x = -0.55 + Math.sin(animTime * 1.5) * 0.04;
            rightEye.position.x = 0.55 + Math.sin(animTime * 1.5) * 0.04;
            // Occasional thinking blink (one eye)
            if (Math.sin(animTime * 0.7) > 0.7) {
                leftEye.scale.y = lerp(leftEye.scale.y, 0.3, lerpSpeed);
            }
            // Slow head sway
            robot.rotation.y = Math.sin(animTime * 0.8) * 0.06;
            break;

        case STATES.TALKING:
            // Mouth talking animation — varied syllable-like shapes
            const talkPhase = Math.sin(animTime * 12);
            const talkPhase2 = Math.sin(animTime * 7 + 1.5);
            mouth.scale.y = 1 + Math.abs(talkPhase) * 1.8 + Math.abs(talkPhase2) * 0.5;
            mouth.scale.x = 1 + Math.sin(animTime * 5) * 0.15 + Math.abs(talkPhase2) * 0.1;
            // Eyes look slightly side to side while talking
            leftEye.position.x = -0.55 + Math.sin(animTime * 2) * 0.03;
            rightEye.position.x = 0.55 + Math.sin(animTime * 2) * 0.03;
            // Slight head bob
            robot.position.y = bob + Math.sin(animTime * 6) * 0.03;
            // Floating particles
            particleMat.opacity = 0.4;
            break;

        case STATES.SPINNING:
            spinTimer += dt;
            // Spin the head
            robot.rotation.y = spinTimer * Math.PI * 4;
            if (spinTimer >= spinDuration) {
                currentState = STATES.WALKING;
                stateDuration = 999;
                robot.rotation.y = 0;
            }
            break;

        case STATES.SLEEPING:
            // Slow breathing bob
            robot.position.y = Math.sin(animTime * 1.2) * 0.04;
            // Slow sway
            robot.rotation.y = Math.sin(animTime * 0.5) * 0.03;
            break;

        case STATES.LISTENING:
            // Ears perk up — glow pulses rapidly
            glowRing.material.opacity = 0.15 + Math.sin(animTime * 8) * 0.1;
            glowRing.scale.setScalar(1.1 + Math.sin(animTime * 6) * 0.15);
            glowRing2.material.opacity = 0.08 + Math.sin(animTime * 7) * 0.05;
            // Head tilts slightly toward sound (user)
            robot.rotation.y = Math.sin(animTime * 2) * 0.08;
            // Gentle bob — attentive
            robot.position.y = bob + Math.sin(animTime * 3) * 0.04;
            // Eyes glow brighter
            targetGlowOpacity = 0.6;
            break;

        case STATES.RECORDING:
            // Red pulsing glow — recording indicator
            glowRing.material.color.setHex(0xff3333);
            glowRing.material.opacity = 0.2 + Math.sin(animTime * 6) * 0.15;
            glowRing.scale.setScalar(1.15 + Math.sin(animTime * 4) * 0.2);
            glowRing2.material.color.setHex(0xff3333);
            glowRing2.material.opacity = 0.1 + Math.sin(animTime * 5) * 0.08;
            // Steady attentive bob
            robot.position.y = bob + Math.sin(animTime * 4) * 0.03;
            // Slight forward lean
            robot.rotation.x = 0.06;
            // Eyes pulse with recording rhythm
            const recPulse = Math.sin(animTime * 5);
            leftEye.scale.x = 1 + recPulse * 0.08;
            rightEye.scale.x = 1 + recPulse * 0.08;
            // Mouth subtle wave (listening)
            mouth.scale.y = 1 + Math.sin(animTime * 3) * 0.15;
            // Override eye color to red while recording
            currentEyeColor.lerp(new THREE.Color(0xff4444), lerpSpeed);
            leftEye.material.color.copy(currentEyeColor);
            rightEye.material.color.copy(currentEyeColor);
            leftGlow.material.color.copy(currentEyeColor);
            rightGlow.material.color.copy(currentEyeColor);
            targetGlowOpacity = 0.8;
            break;

        case STATES.DANCING:
            // Beat-following dance — rhythmic bounces, spins, blinks, and color shifts
            danceBeatTimer += dt;
            danceBlinkTimer += dt;

            // Beat hit — every danceBeatInterval seconds
            if (danceBeatTimer >= danceBeatInterval) {
                danceBeatTimer = 0;
                danceMoveIndex = (danceMoveIndex + 1) % 6;
            }

            // Beat progress 0-1 within current beat
            var beatProgress = danceBeatTimer / danceBeatInterval;
            var beatPulse = Math.sin(beatProgress * Math.PI); // 0->1->0 per beat

            // Dance moves cycle through 6 patterns
            switch (danceMoveIndex) {
                case 0: // Bounce up and down
                    robot.position.y = bob + beatPulse * 0.25;
                    robot.rotation.y = Math.sin(animTime * 3) * 0.1;
                    robot.rotation.z = 0;
                    break;
                case 1: // Side-to-side sway
                    robot.position.y = bob + beatPulse * 0.12;
                    robot.rotation.y = Math.sin(animTime * 4) * 0.15;
                    robot.rotation.z = Math.sin(animTime * 2) * 0.08;
                    break;
                case 2: // Head spin (quarter turns on beat)
                    robot.position.y = bob + beatPulse * 0.15;
                    robot.rotation.y = beatPulse * Math.PI * 0.5 * (Math.floor(animTime) % 2 ? 1 : -1);
                    robot.rotation.z = 0;
                    break;
                case 3: // Lean back and forth
                    robot.position.y = bob + Math.abs(beatPulse) * 0.18;
                    robot.rotation.x = beatPulse * 0.15;
                    robot.rotation.y = Math.sin(animTime * 2) * 0.06;
                    robot.rotation.z = 0;
                    break;
                case 4: // Wiggle — fast z rotation
                    robot.position.y = bob + beatPulse * 0.1;
                    robot.rotation.z = Math.sin(animTime * 8) * 0.12;
                    robot.rotation.y = Math.sin(animTime * 5) * 0.08;
                    break;
                case 5: // Big bounce with spin
                    robot.position.y = bob + Math.abs(beatPulse) * 0.3;
                    robot.rotation.y = beatProgress * Math.PI * 2;
                    robot.rotation.z = Math.sin(animTime * 6) * 0.05;
                    break;
            }

            // Rhythmic eye pulse on beat
            var eyePulse = 1 + beatPulse * 0.3;
            leftEye.scale.x = eyePulse;
            rightEye.scale.x = eyePulse;
            leftEye.scale.y = eyePulse;
            rightEye.scale.y = eyePulse;

            // Rhythmic blinking — blink on every other beat
            if (danceBlinkTimer >= danceBeatInterval * 2) {
                danceBlinkTimer = 0;
                targetLeftEyeScaleY = 0.05;
                targetRightEyeScaleY = 0.05;
                isBlinking = true;
                blinkDuration = 0.1;
            }

            // Mouth moves with the beat
            mouth.scale.y = 1 + beatPulse * 1.5;
            mouth.scale.x = 1 + beatPulse * 0.3;

            // Cycle through neon colors on each beat
            var danceColors = [0x00e5ff, 0x00ff99, 0xff00ff, 0xffdd00, 0xff6644, 0x66aaff];
            var colorIdx = Math.floor(animTime / danceBeatInterval) % danceColors.length;
            targetEyeColor.setHex(danceColors[colorIdx]);
            targetMouthColor.setHex(danceColors[colorIdx]);

            // Glow rings pulse with beat
            glowRing.material.opacity = 0.15 + beatPulse * 0.2;
            glowRing.scale.setScalar(1 + beatPulse * 0.3);
            glowRing2.material.opacity = 0.08 + beatPulse * 0.1;
            glowRing2.scale.setScalar(1 + beatPulse * 0.2);

            // Particles sparkle during dance
            particleMat.opacity = 0.3 + beatPulse * 0.3;
            targetGlowOpacity = 0.4 + beatPulse * 0.3;

            // Check activity timeout — stop dancing if user inactive
            if (animTime - lastActivityTime > ACTIVITY_TIMEOUT) {
                stopDancing();
            }
            break;
    }

    // ── Glow ring pulse ──
    glowRing.scale.setScalar(1 + Math.sin(animTime * 2.5) * 0.12);
    glowRing.material.opacity = 0.08 + Math.sin(animTime * 2.5) * 0.04;
    glowRing2.scale.setScalar(1 + Math.sin(animTime * 2.5 + 1) * 0.08);
    glowRing2.material.opacity = 0.04 + Math.sin(animTime * 2.5 + 1) * 0.02;

    // ── Edge glow pulse ──
    edges.material.opacity = 0.3 + Math.sin(animTime * 2) * 0.1;

    // ── Particle update ──
    if (currentState === STATES.THINKING || currentState === STATES.TALKING) {
        const positions = particleGeo.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
            const v = particleVelocities[i];
            positions[i * 3] += v.x;
            positions[i * 3 + 1] += v.y;
            positions[i * 3 + 2] += v.z;
            v.life -= dt * 0.5;
            if (v.life <= 0) {
                positions[i * 3] = (Math.random() - 0.5) * 3;
                positions[i * 3 + 1] = -1.0;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
                v.life = 1;
                v.y = Math.random() * 0.015 + 0.003;
            }
        }
        particleGeo.attributes.position.needsUpdate = true;
    } else {
        particleMat.opacity = Math.max(0, particleMat.opacity - dt * 2);
    }

    // ── Auto behavior transitions ──
    if (currentState !== STATES.WALKING && currentState !== STATES.SPINNING &&
        currentState !== STATES.THINKING && currentState !== STATES.TALKING &&
        currentState !== STATES.LISTENING && currentState !== STATES.RECORDING &&
        stateTimer >= stateDuration) {
        if (currentState === STATES.GREETING) {
            currentState = STATES.IDLE;
            stateDuration = 3 + Math.random() * 5;
            currentExpression = EXPRESSIONS.NEUTRAL;
            updateExpression();
        } else {
            pickNextBehavior();
        }
    }

    // ── Walking movement (2D — any direction) ──
    if (currentState === STATES.WALKING && !isDragging) {
        const dx = walkTargetX - robotScreenX;
        const dy = walkTargetY - robotScreenY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 4) {
            robotScreenX = walkTargetX;
            robotScreenY = walkTargetY;
            currentState = STATES.IDLE;
            stateDuration = 3 + Math.random() * 4;
        } else {
            const step = walkSpeed * dt;
            if (dist < step) {
                robotScreenX = walkTargetX;
                robotScreenY = walkTargetY;
            } else {
                robotScreenX += (dx / dist) * step;
                robotScreenY += (dy / dist) * step;
                facingRight = dx > 0;
            }
        }
        // Clamp Y to stay above keyboard
        if (keyboardVisible && keyboardTopY > 0) {
            const maxY = keyboardTopY - robotSize * 0.5;
            if (robotScreenY > maxY) robotScreenY = maxY;
        }
    }

    // ── Teleport/Blink animation ──
    if (isTeleporting) {
        if (teleportPhase === 0) {
            // Fade out
            teleportAlpha -= dt * 6;
            robot.traverse(function(child) {
                if (child.material) {
                    child.material.transparent = true;
                    child.material.opacity = Math.max(0, teleportAlpha * 0.3);
                }
            });
            handsGroup.traverse(function(child) {
                if (child.material) {
                    child.material.transparent = true;
                    child.material.opacity = Math.max(0, teleportAlpha * 0.3);
                }
            });
            if (teleportAlpha <= 0) {
                teleportAlpha = 0;
                teleportPhase = 1;
                // Instant move to target
                robotScreenX = teleportTargetX;
                robotScreenY = teleportTargetY;
                // Clamp Y to stay above keyboard
                if (keyboardVisible && keyboardTopY > 0) {
                    const maxY = keyboardTopY - robotSize * 0.5;
                    if (robotScreenY > maxY) robotScreenY = maxY;
                }
                facingRight = teleportTargetX > robotScreenX;
            }
        } else {
            // Fade in
            teleportAlpha += dt * 6;
            robot.traverse(function(child) {
                if (child.material) {
                    child.material.transparent = true;
                    child.material.opacity = Math.min(1, teleportAlpha * 0.3);
                }
            });
            handsGroup.traverse(function(child) {
                if (child.material) {
                    child.material.transparent = true;
                    child.material.opacity = Math.min(1, teleportAlpha * 0.3);
                }
            });
            if (teleportAlpha >= 1) {
                teleportAlpha = 1;
                isTeleporting = false;
                // Restore full opacity
                robot.traverse(function(child) {
                    if (child.material) child.material.opacity = 0.3;
                });
                currentState = STATES.IDLE;
                stateDuration = 2 + Math.random() * 3;
            }
        }
        // Skip normal movement while teleporting
        renderer.render(scene, camera);
        return;
    }

    // ── 3D Depth Scaling (always active, smooth) ──
    // Auto depth: based on Y position — smaller at top (far), bigger at bottom (close)
    // Manual zoom: AI can override with setZoom()
    let autoDepthScale = 0.4 + (robotScreenY / screenHeight) * 1.0; // 0.4 at top, 1.4 at bottom
    if (zoomOverride > 0) {
        targetScale = zoomOverride;
    } else {
        targetScale = autoDepthScale;
    }
    currentScale = lerp(currentScale, targetScale, 3 * dt);
    robot.scale.setScalar(currentScale);
    // Notify Java of position with effective size
    const effectiveSize = robotSize * currentScale;
    if (window.JSBridge) JSBridge.onRobotPosition(robotScreenX, robotScreenY, effectiveSize);

    renderer.render(scene, camera);
}

// ── Resize handler ──
window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Start ──
animate();

// Start walking after a brief delay — head to a random edge
setTimeout(function() {
    if (currentState === STATES.IDLE) walkRandomEdge();
}, 2000);

})();
</script>

<!-- ── MediaPipe Hand Tracking (Web-based) ── -->
<!-- Uses MediaPipe Tasks Vision JS (WASM) to detect hand landmarks via webcam.
     Pinch gesture (thumb + index) grabs the robot, move hand to drag, release to drop.
     Runs entirely in the WebView — no native camera overlay needed. -->
<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

(function() {
'use strict';

let handLandmarker = null;
let videoEl = null;
let handTrackingActive = false;
let handTrackingLoop = null;
let isPinching = false;
let smoothedX = 0.5;
let smoothedY = 0.5;
const SMOOTHING = 0.5;
const PINCH_GRAB = 0.07;
const PINCH_RELEASE = 0.12;

// Expose start/stop controls to Java via ArgosJS
window.ArgosHandTracking = {
    start: async function() {
        if (handTrackingActive) return;
        try {
            // Load MediaPipe WASM
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 1,
                minHandDetectionConfidence: 0.4,
                minHandPresenceConfidence: 0.4,
                minTrackingConfidence: 0.4
            });

            // Create hidden video element for camera
            videoEl = document.createElement('video');
            videoEl.style.cssText = 'position:fixed;bottom:10px;right:10px;width:120px;height:160px;z-index:9999;opacity:0.3;border:2px solid #00ff88;border-radius:8px;mirror:true;';
            videoEl.autoplay = true;
            videoEl.playsinline = true;
            videoEl.muted = true;
            document.body.appendChild(videoEl);

            // Get camera stream (front camera)
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'user',
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            });
            videoEl.srcObject = stream;
            await videoEl.play();

            handTrackingActive = true;
            if (window.JSBridge) JSBridge.onHandTrackingStatus('active');

            // Start detection loop
            let lastVideoTime = -1;
            function detectLoop() {
                if (!handTrackingActive || !handLandmarker || !videoEl) return;
                if (videoEl.currentTime !== lastVideoTime) {
                    lastVideoTime = videoEl.currentTime;
                    const result = handLandmarker.detectForVideo(videoEl, performance.now());
                    processHandResult(result);
                }
                handTrackingLoop = requestAnimationFrame(detectLoop);
            }
            detectLoop();
        } catch (e) {
            console.error('Hand tracking start error:', e);
            if (window.JSBridge) JSBridge.onHandTrackingStatus('error');
        }
    },

    stop: function() {
        handTrackingActive = false;
        if (handTrackingLoop) {
            cancelAnimationFrame(handTrackingLoop);
            handTrackingLoop = null;
        }
        if (videoEl && videoEl.srcObject) {
            videoEl.srcObject.getTracks().forEach(t => t.stop());
            videoEl.srcObject = null;
        }
        if (videoEl && videoEl.parentNode) {
            videoEl.parentNode.removeChild(videoEl);
        }
        if (handLandmarker) {
            handLandmarker.close();
            handLandmarker = null;
        }
        isPinching = false;
        if (window.JSBridge) JSBridge.onHandTrackingStatus('stopped');
    },

    toggle: function() {
        if (handTrackingActive) this.stop();
        else this.start();
    },

    isActive: function() {
        return handTrackingActive;
    }
};

function processHandResult(result) {
    if (!result || !result.landmarks || result.landmarks.length === 0) {
        // No hand detected
        if (isPinching) {
            isPinching = false;
            if (window.JSBridge) JSBridge.onHandRelease(smoothedX, smoothedY);
        }
        return;
    }

    const landmarks = result.landmarks[0];
    if (landmarks.length < 9) return;

    // Landmark 4 = thumb tip, 8 = index finger tip
    const thumb = landmarks[4];
    const index = landmarks[8];

    // Pinch distance (normalized 0-1)
    const dx = thumb.x - index.x;
    const dy = thumb.y - index.y;
    const pinchDist = Math.sqrt(dx * dx + dy * dy);

    // Hand position = midpoint of thumb and index
    // Front camera is mirrored, so flip X
    let rawX = 1.0 - ((thumb.x + index.x) / 2.0);
    let rawY = (thumb.y + index.y) / 2.0;
    rawX = Math.max(0, Math.min(1, rawX));
    rawY = Math.max(0, Math.min(1, rawY));

    // Smooth
    smoothedX = smoothedX + (rawX - smoothedX) * SMOOTHING;
    smoothedY = smoothedY + (rawY - smoothedY) * SMOOTHING;

    // Gesture detection with hysteresis
    if (!isPinching && pinchDist < PINCH_GRAB) {
        isPinching = true;
        if (window.JSBridge) JSBridge.onHandGrab(smoothedX, smoothedY);
    } else if (isPinching && pinchDist > PINCH_RELEASE) {
        isPinching = false;
        if (window.JSBridge) JSBridge.onHandRelease(smoothedX, smoothedY);
    } else if (isPinching) {
        if (window.JSBridge) JSBridge.onHandDrag(smoothedX, smoothedY);
    }
}

})();
</script>
