<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
#canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script src="three.min.js"></script>
<script>
(function() {
'use strict';

// ── Argos Robot — Modern Geometric Emoji Face ──
// Pure black head, cyan square eyes, cyan mouth bar — modern flat design

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 3.2);
camera.lookAt(0, 0, 0);

// ── Lighting ──
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff, 0.4);
keyLight.position.set(1, 2, 3);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x00cccc, 0.3);
rimLight.position.set(-1, 1, -2);
scene.add(rimLight);

// ── Robot Group (pure head) ──
const robot = new THREE.Group();
scene.add(robot);

// ── Materials ──
// Modern MeshPhysicalMaterial for the spherical head — adds clearcoat for a
// glossy robotic shell finish and metalness for a premium look. Based on
// Three.js docs (MeshPhysicalMaterial) and modern robot design research.
const headMat = new THREE.MeshPhysicalMaterial({
    color: 0x0a0a0f,
    metalness: 0.4,
    roughness: 0.35,
    clearcoat: 0.6,
    clearcoatRoughness: 0.2,
    emissive: 0x050508,
    emissiveIntensity: 0.5
});
const cyanMat = new THREE.MeshBasicMaterial({ color: 0x00e5cc });
const cyanGlowMat = new THREE.MeshBasicMaterial({
    color: 0x00e5cc, transparent: true, opacity: 0.3,
    blending: THREE.AdditiveBlending, depthWrite: false
});

// ── Head — black sphere (circular) ──
// Radius 1.1 matches half the old box width (2.2) for a similar on-screen size.
// A sphere gives the robot a clean circular silhouette from every angle.
const headGeo = new THREE.SphereGeometry(1.1, 48, 48);
const head = new THREE.Mesh(headGeo, headMat);
robot.add(head);

// Head edge glow (subtle cyan wireframe outline on the sphere)
const edgeGeo = new THREE.WireframeGeometry(headGeo);
const edgeMat = new THREE.LineBasicMaterial({ color: 0x00e5cc, transparent: true, opacity: 0.15 });
const edges = new THREE.LineSegments(edgeGeo, edgeMat);
robot.add(edges);

// ── Eyes — cyan squares ──
// Reprojected onto the sphere surface: at (x=±0.55, y=0.15) the sphere
// surface sits at z ≈ sqrt(1.1² − 0.55² − 0.15²) ≈ 0.94, so place eyes
// at z=0.95 to sit just on the surface.
const eyeGeo = new THREE.BoxGeometry(0.5, 0.5, 0.15);

const leftEye = new THREE.Mesh(eyeGeo, cyanMat);
leftEye.position.set(-0.55, 0.15, 0.95);
robot.add(leftEye);

const rightEye = new THREE.Mesh(eyeGeo, cyanMat);
rightEye.position.set(0.55, 0.15, 0.95);
robot.add(rightEye);

// Eye glow planes (behind eyes for neon effect)
const glowGeo = new THREE.PlaneGeometry(0.7, 0.7);
const leftGlow = new THREE.Mesh(glowGeo, cyanGlowMat);
leftGlow.position.set(-0.55, 0.15, 0.92);
robot.add(leftGlow);

const rightGlow = new THREE.Mesh(glowGeo, cyanGlowMat);
rightGlow.position.set(0.55, 0.15, 0.92);
robot.add(rightGlow);

// ── Mouth — cyan horizontal bar ──
// Reprojected onto sphere surface: at (x=0, y=−0.45) z ≈ sqrt(1.1² − 0.45²) ≈ 1.0
const mouthGeo = new THREE.BoxGeometry(0.9, 0.12, 0.15);
const mouth = new THREE.Mesh(mouthGeo, cyanMat);
mouth.position.set(0, -0.45, 1.0);
robot.add(mouth);

// Mouth glow
const mouthGlowGeo = new THREE.PlaneGeometry(1.1, 0.25);
const mouthGlow = new THREE.Mesh(mouthGlowGeo, cyanGlowMat.clone());
mouthGlow.position.set(0, -0.45, 0.97);
robot.add(mouthGlow);

// ── Hover glow ring (beneath head) ──
const glowRingGeo = new THREE.RingGeometry(0.6, 1.4, 32);
const glowRingMat = new THREE.MeshBasicMaterial({
    color: 0x00e5cc, transparent: true, opacity: 0.1,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending
});
const glowRing = new THREE.Mesh(glowRingGeo, glowRingMat);
glowRing.rotation.x = -Math.PI / 2;
glowRing.position.y = -1.2;
robot.add(glowRing);

const glowRing2Geo = new THREE.RingGeometry(0.8, 1.8, 32);
const glowRing2Mat = new THREE.MeshBasicMaterial({
    color: 0x00b8aa, transparent: true, opacity: 0.05,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending
});
const glowRing2 = new THREE.Mesh(glowRing2Geo, glowRing2Mat);
glowRing2.rotation.x = -Math.PI / 2;
glowRing2.position.y = -1.25;
robot.add(glowRing2);

// ── Thinking dots ──
const thinkingGroup = new THREE.Group();
thinkingGroup.position.y = 1.2;
thinkingGroup.visible = false;
robot.add(thinkingGroup);

// ── Back panel (visible when robot turns 180 to look at screen) ──
// Circular disc on the back of the sphere — matches the new circular design.
const backPanelGeo = new THREE.CircleGeometry(0.9, 48);
const backPanelMat = new THREE.MeshPhongMaterial({
    color: 0x12121a, shininess: 60, specular: 0x222233,
    emissive: 0x080810, emissiveIntensity: 0.3,
    side: THREE.DoubleSide
});
const backPanel = new THREE.Mesh(backPanelGeo, backPanelMat);
backPanel.position.set(0, 0, -1.06);
robot.add(backPanel);

// Back panel edge glow (ring around the circular back panel)
const backEdgeGeo = new THREE.RingGeometry(0.9, 0.95, 48);
const backEdgeMat = new THREE.LineBasicMaterial({ color: 0x00e5cc, transparent: true, opacity: 0.3 });
const backEdges = new THREE.Mesh(backEdgeGeo, backEdgeMat);
backEdges.position.copy(backPanel.position);
robot.add(backEdges);

// Camera lens on back (looks like it's scanning the screen)
const lensGeo = new THREE.CircleGeometry(0.25, 24);
const lensMat = new THREE.MeshBasicMaterial({ color: 0x00e5cc, transparent: true, opacity: 0.8 });
const lens = new THREE.Mesh(lensGeo, lensMat);
lens.position.set(0, 0, -1.07);
robot.add(lens);

// Lens ring
const lensRingGeo = new THREE.RingGeometry(0.25, 0.32, 24);
const lensRingMat = new THREE.MeshBasicMaterial({ color: 0x00b8aa, transparent: true, opacity: 0.5, side: THREE.DoubleSide });
const lensRing = new THREE.Mesh(lensRingGeo, lensRingMat);
lensRing.position.set(0, 0, -1.08);
robot.add(lensRing);

// Antenna on top of the sphere
const antennaGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.4, 8);
const antennaMat = new THREE.MeshPhongMaterial({ color: 0x1a1a2e });
const antenna = new THREE.Mesh(antennaGeo, antennaMat);
antenna.position.set(0, 1.3, 0);
robot.add(antenna);

const antennaTipGeo = new THREE.SphereGeometry(0.08, 12, 12);
const antennaTipMat = new THREE.MeshBasicMaterial({ color: 0x00e5cc });
const antennaTip = new THREE.Mesh(antennaTipGeo, antennaTipMat);
antennaTip.position.set(0, 1.52, 0);
robot.add(antennaTip);

// ── Floating Hands (neon blue, 3 fingers, no arms) ──
// Hands are 1/4 the size of the head (head=2.2 wide, hand~0.55)
// Positioned at the BOTTOM of the robot, not the top
// Neon blue color — stands out against the cyan/teal robot body
const NEON_BLUE = 0x00aaff;
const handMat = new THREE.MeshPhongMaterial({
    color: NEON_BLUE, transparent: true, opacity: 0.92,
    shininess: 60, emissive: 0x002244, emissiveIntensity: 0.4
});
const handGlowMat = new THREE.MeshBasicMaterial({
    color: NEON_BLUE, transparent: true, opacity: 0.25,
    blending: THREE.AdditiveBlending, depthWrite: false
});

// Palm — rounded using a slightly flattened sphere for a modern look
const palmGeo = new THREE.SphereGeometry(0.28, 24, 16);
// Finger phalanx — cylinder + sphere caps (capsule equivalent, since
// CapsuleGeometry is not available in Three.js r128)
const phalanxRadius = 0.06;
const phalanxLength = 0.22;
const phalanxCylGeo = new THREE.CylinderGeometry(phalanxRadius, phalanxRadius, phalanxLength, 12);
const phalanxCapGeo = new THREE.SphereGeometry(phalanxRadius, 12, 10);
// Thumb phalanx — shorter
const thumbRadius = 0.055;
const thumbLength = 0.16;
const thumbCylGeo = new THREE.CylinderGeometry(thumbRadius, thumbRadius, thumbLength, 12);
const thumbCapGeo = new THREE.SphereGeometry(thumbRadius, 12, 10);
// Knuckle joint — small sphere at each joint for articulation detail
const knuckleGeo = new THREE.SphereGeometry(0.07, 12, 12);

// Helper: build a capsule-like mesh (cylinder with rounded sphere caps)
// Returns a group oriented along +Y with the base at y=0.
function createCapsuleMesh(cylGeo, capGeo, mat, totalLength) {
    var group = new THREE.Group();
    var cyl = new THREE.Mesh(cylGeo, mat);
    cyl.position.set(0, totalLength / 2, 0);
    group.add(cyl);
    var capBottom = new THREE.Mesh(capGeo, mat);
    capBottom.position.set(0, 0, 0);
    group.add(capBottom);
    var capTop = new THREE.Mesh(capGeo, mat);
    capTop.position.set(0, totalLength, 0);
    group.add(capTop);
    return group;
}

// Build a single articulated finger with 2 phalanges (proximal + distal).
// Returns the proximal joint group; rotating it curls the whole finger,
// and rotating the distal child curls just the tip.
function createFinger(baseX, baseY, length1, length2) {
    // Proximal joint group (knuckle) — pivot at the palm attachment
    var proximalGroup = new THREE.Group();
    proximalGroup.position.set(baseX, baseY, 0);

    // Proximal phalanx — capsule (cylinder + sphere caps)
    var proximal = createCapsuleMesh(phalanxCylGeo, phalanxCapGeo, handMat, length1);
    proximalGroup.add(proximal);

    // Proximal glow
    var proxGlow = new THREE.Mesh(new THREE.PlaneGeometry(0.16, length1 + 0.08), handGlowMat);
    proxGlow.position.set(0, length1 / 2, -0.06);
    proximalGroup.add(proxGlow);

    // Knuckle sphere at the base
    var knuckle1 = new THREE.Mesh(knuckleGeo, handMat);
    knuckle1.position.set(0, 0, 0);
    proximalGroup.add(knuckle1);

    // Distal joint group — child of proximal, positioned at the top
    var distalGroup = new THREE.Group();
    distalGroup.position.set(0, length1, 0);
    proximalGroup.add(distalGroup);

    // Distal phalanx — scaled capsule
    var distal = createCapsuleMesh(phalanxCylGeo, phalanxCapGeo, handMat, length2);
    distal.scale.setScalar(length2 / length1);
    distalGroup.add(distal);

    // Distal glow
    var distGlow = new THREE.Mesh(new THREE.PlaneGeometry(0.14, length2 + 0.06), handGlowMat);
    distGlow.position.set(0, length2 / 2, -0.05);
    distalGroup.add(distGlow);

    // Fingertip — rounded sphere cap (already part of capsule, but add a
    // slightly larger one for a pronounced fingertip)
    var fingertip = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 12), handMat);
    fingertip.position.set(0, length2, 0);
    distalGroup.add(fingertip);

    // Store references for curl animation
    proximalGroup.userData.distalGroup = distalGroup;
    return proximalGroup;
}

function createHand() {
    var handGroup = new THREE.Group();

    // Palm — rounded sphere, slightly flattened
    var palm = new THREE.Mesh(palmGeo, handMat);
    palm.scale.set(1.0, 1.1, 0.55);
    palm.position.set(0, 0, 0);
    handGroup.add(palm);

    // Palm glow
    var palmGlow = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.55), handGlowMat);
    palmGlow.position.set(0, 0, -0.12);
    handGroup.add(palmGlow);

    // 4 fingers — anatomical spread across the top of the palm
    // Proportions: index/middle longer, ring slightly shorter, pinky shortest
    var fingerConfigs = [
        { x: -0.20, l1: 0.24, l2: 0.20 }, // index
        { x: -0.07, l1: 0.26, l2: 0.22 }, // middle (longest)
        { x:  0.07, l1: 0.24, l2: 0.20 }, // ring
        { x:  0.20, l1: 0.20, l2: 0.17 }, // pinky (shortest)
    ];
    var fingers = [];
    for (var i = 0; i < fingerConfigs.length; i++) {
        var cfg = fingerConfigs[i];
        var finger = createFinger(cfg.x, 0.22, cfg.l1, cfg.l2);
        handGroup.add(finger);
        fingers.push(finger);
    }
    handGroup.userData.fingers = fingers;

    // Thumb — 2 phalanges, positioned on the side at an angle
    var thumbBase = new THREE.Group();
    thumbBase.position.set(-0.28, -0.02, 0.05);
    thumbBase.rotation.z = 0.9; // angled outward
    handGroup.add(thumbBase);

    var thumbProximal = createCapsuleMesh(thumbCylGeo, thumbCapGeo, handMat, thumbLength);
    thumbBase.add(thumbProximal);

    var thumbKnuckle = new THREE.Mesh(knuckleGeo, handMat);
    thumbKnuckle.position.set(0, 0, 0);
    thumbBase.add(thumbKnuckle);

    var thumbDistalGroup = new THREE.Group();
    thumbDistalGroup.position.set(0, 0.20, 0);
    thumbBase.add(thumbDistalGroup);

    var thumbDistal = createCapsuleMesh(thumbCylGeo, thumbCapGeo, handMat, thumbLength * 0.75);
    thumbDistal.scale.setScalar(0.75);
    thumbDistalGroup.add(thumbDistal);

    var thumbTip = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), handMat);
    thumbTip.position.set(0, 0.16, 0);
    thumbDistalGroup.add(thumbTip);

    handGroup.userData.thumb = { base: thumbBase, distal: thumbDistalGroup };

    return handGroup;
}

// ── Hands group (separate from robot so hands always face camera) ──
// Hands are NOT children of the robot group. Instead they live in a
// separate group that copies the robot's position and scale but NOT its
// rotation. This ensures the hands always appear in FRONT of the robot,
// even when the robot spins or turns 180° to look at the screen.
var handsGroup = new THREE.Group();
scene.add(handsGroup);

// Left hand — positioned at the BOTTOM-LEFT of the head, bigger scale (1/4 of head)
var leftHand = createHand();
leftHand.position.set(-0.85, -1.35, 0.9); // z=0.9 = in front of head face (z=0.8)
leftHand.scale.setScalar(0.85);
handsGroup.add(leftHand);

// Right hand — positioned at the BOTTOM-RIGHT of the head, bigger scale (1/4 of head)
var rightHand = createHand();
rightHand.position.set(0.85, -1.35, 0.9); // z=0.9 = in front of head face
rightHand.scale.setScalar(0.85);
rightHand.scale.x = -0.85; // mirror
handsGroup.add(rightHand);

// Hand animation targets (z=0.9 = always in front of the head face)
var leftHandTargetX = -0.85, leftHandTargetY = -1.35, leftHandTargetZ = 0.9;
var leftHandTargetRotX = 0, leftHandTargetRotY = 0, leftHandTargetRotZ = 0;
var rightHandTargetX = 0.85, rightHandTargetY = -1.35, rightHandTargetZ = 0.9;
var rightHandTargetRotX = 0, rightHandTargetRotY = 0, rightHandTargetRotZ = 0;
var handsVisible = false;

// Finger curl state — per-finger curl amount (0=open, 1=clenched).
// targetFingerCurl is set by applyHandGesture(); currentFingerCurl is
// smoothly interpolated toward it in the animate loop for natural motion.
// Order: [index, middle, ring, pinky]
var targetFingerCurl = [0.15, 0.15, 0.15, 0.15];
var currentFingerCurl = [0.15, 0.15, 0.15, 0.15];
var targetThumbCurl = 0.1;
var currentThumbCurl = 0.1;

// ── Tear drops (for laughing — tears of joy) ──
var tearGeo = new THREE.SphereGeometry(0.08, 12, 12);
var tearMat = new THREE.MeshBasicMaterial({
    color: 0x66ccff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
});

var leftTear = new THREE.Mesh(tearGeo, tearMat.clone());
leftTear.position.set(-0.55, 0.0, 0.9);
robot.add(leftTear);

var rightTear = new THREE.Mesh(tearGeo, tearMat.clone());
rightTear.position.set(0.55, 0.0, 0.9);
robot.add(rightTear);

var tearTimer = 0;
var tearPhase = 0; // 0=forming, 1=falling, 2=gone

const dotGeo = new THREE.SphereGeometry(0.06, 12, 12);
const dotMat = new THREE.MeshBasicMaterial({ color: 0x00e5cc, transparent: true });
for (let i = 0; i < 3; i++) {
    const dot = new THREE.Mesh(dotGeo, dotMat.clone());
    dot.position.x = -0.2 + i * 0.2;
    dot.material.opacity = 0.3;
    thinkingGroup.add(dot);
}

// ── Particle sparkles ──
const particleCount = 40;
const particleGeo = new THREE.BufferGeometry();
const particlePositions = new Float32Array(particleCount * 3);
const particleVelocities = [];
for (let i = 0; i < particleCount; i++) {
    particlePositions[i * 3] = (Math.random() - 0.5) * 3;
    particlePositions[i * 3 + 1] = (Math.random() - 0.5) * 2.5;
    particlePositions[i * 3 + 2] = (Math.random() - 0.5) * 0.5;
    particleVelocities.push({
        x: (Math.random() - 0.5) * 0.008,
        y: Math.random() * 0.015 + 0.003,
        z: (Math.random() - 0.5) * 0.008,
        life: Math.random()
    });
}
particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
const particleMat = new THREE.PointsMaterial({
    color: 0x00e5cc, size: 0.04, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
});
const particles = new THREE.Points(particleGeo, particleMat);
robot.add(particles);

// ── State Management ──
const STATES = { IDLE: 'idle', WALKING: 'walking', GREETING: 'greeting', THINKING: 'thinking', TALKING: 'talking', SPINNING: 'spinning', SLEEPING: 'sleeping', LISTENING: 'listening', RECORDING: 'recording', DANCING: 'dancing' };
const EXPRESSIONS = { NEUTRAL: 'neutral', HAPPY: 'happy', THINKING: 'thinking', TALKING: 'talking', SLEEPING: 'sleeping', SURPRISED: 'surprised', BLINK: 'blink', WINK: 'wink', LOVE: 'love', ANGRY: 'angry', SAD: 'sad', CONFUSED: 'confused', EXCITED: 'excited', DIZZY: 'dizzy', STAR_EYES: 'star_eyes', SCARED: 'scared', LAUGHING: 'laughing', HIDING_EYES: 'hiding_eyes' };

// Blink/teleport state
let isTeleporting = false;
let teleportPhase = 0; // 0=fade_out, 1=fade_in
let teleportTargetX = 0;
let teleportTargetY = 0;
let teleportAlpha = 1.0;
let currentState = STATES.IDLE;
let currentExpression = EXPRESSIONS.NEUTRAL;
let stateTimer = 0;
let stateDuration = 3;
let animTime = 0;
let facingRight = true;
let walkTargetX = 0;
let walkTargetY = 0;
let currentScale = 1.0;
let targetScale = 1.0;
let zoomOverride = 0; // 0 = auto depth, >0 = manual zoom level
let screenWidth = 1080;
let screenHeight = 1920;
let robotSize = 100;
// Initialize to screen center so the robot doesn't flash at the top-left
// corner before Java calls setPosition() in onPageFinished.
let robotScreenX = screenWidth / 2;
let robotScreenY = screenHeight * 0.35;
let isDragging = false;
let blinkTimer = 3;
let isBlinking = false;
let blinkDuration = 0;
let spinTimer = 0;
let spinDuration = 1.0;
let walkSpeed = 150;
let standbyMode = false;
let keyboardVisible = false;
let keyboardTopY = 0;

// Dance system — triggered when user is actively using device
let userActive = false;
let danceBeatTimer = 0;
let danceBeatInterval = 0.5; // seconds per beat (120 BPM default)
let danceMoveIndex = 0;
let danceBlinkTimer = 0;
let lastActivityTime = 0;
const ACTIVITY_TIMEOUT = 30; // seconds of inactivity before stopping dance

// Turn animation state (180-degree turn to look at screen)
let isTurning = false;
let turnPhase = 0; // 0=turning to screen, 1=holding, 2=turning back
let turnTimer = 0;
let turnDuration = 0.6; // seconds for each half turn
let turnHoldDuration = 1.5; // hold while "looking" at screen
let turnTargetY = 0; // target rotation.y for turn

// Sequential expression system
let expressionSequence = []; // array of {expr, duration}
let sequenceIndex = 0;
let sequenceTimer = 0;
let sequenceActive = false;

// Expression targets for smooth interpolation
let targetLeftEyeScaleX = 1, targetLeftEyeScaleY = 1;
let targetRightEyeScaleX = 1, targetRightEyeScaleY = 1;
let targetLeftEyePosY = 0.15, targetRightEyePosY = 0.15;
let targetMouthScaleX = 1, targetMouthScaleY = 1, targetMouthPosY = -0.45;
let targetMouthRotation = 0;
let targetHeadTilt = 0, targetHeadTiltZ = 0;
let targetGlowOpacity = 0.3;
let targetEyeColor = new THREE.Color(0x00e5cc);
let targetMouthColor = new THREE.Color(0x00e5cc);
let currentEyeColor = new THREE.Color(0x00e5cc);
let currentMouthColor = new THREE.Color(0x00e5cc);

// ── JavaScript Interface (called from Java) ──
window.ArgosJS = {
    setState: function(state) {
        currentState = state;
        stateTimer = 0;
        if (state === STATES.SPINNING) spinTimer = 0;
        if (state === STATES.THINKING) thinkingGroup.visible = true;
        else thinkingGroup.visible = false;
        updateExpression();
    },
    setThinking: function(val) {
        if (val) {
            currentState = STATES.THINKING;
            currentExpression = EXPRESSIONS.THINKING;
            thinkingGroup.visible = true;
        } else {
            if (currentState === STATES.THINKING) {
                currentState = STATES.IDLE;
                stateDuration = 3;
                currentExpression = EXPRESSIONS.NEUTRAL;
                thinkingGroup.visible = false;
            }
        }
        updateExpression();
    },
    setTalking: function(val) {
        if (val) {
            currentState = STATES.TALKING;
            currentExpression = EXPRESSIONS.TALKING;
        } else {
            if (currentState === STATES.TALKING) {
                currentState = STATES.IDLE;
                stateDuration = 3;
                currentExpression = EXPRESSIONS.NEUTRAL;
            }
        }
        updateExpression();
    },
    setScreenSize: function(w, h) {
        screenWidth = w;
        screenHeight = h;
    },
    setPosition: function(x, y) {
        robotScreenX = x;
        robotScreenY = y;
    },
    setRobotSize: function(size) {
        robotSize = size;
    },
    setDragging: function(val) {
        isDragging = val;
    },
    // AI-controllable expression (case-insensitive — accepts HAPPY, happy, Happy, etc.)
    setExpression: function(name) {
        var upper = String(name || '').toUpperCase().trim();
        if (EXPRESSIONS[upper]) {
            currentExpression = EXPRESSIONS[upper];
            sequenceActive = false; // cancel any running sequence
            updateExpression();
        } else {
            // Fallback: try the raw value in case it's already a lowercase expression value
            currentExpression = name;
            sequenceActive = false;
            updateExpression();
        }
    },
    // AI-controllable hand gesture (case-insensitive)
    // Overrides the expression's default hand position.
    // The AI MUST include a [TOOL:HAND:gesture] tag with every response.
    setHandGesture: function(name) {
        var upper = String(name || '').toUpperCase().trim();
        applyHandGesture(upper);
    },
    // AI-controllable movement
    moveTo: function(x, y) {
        walkToPosition(x, y);
    },
    // Get current position
    getPosition: function() {
        return JSON.stringify({ x: robotScreenX, y: robotScreenY, size: robotSize, scale: currentScale });
    },
    // AI-controllable zoom (1.0 = normal, 0.5 = far/small, 1.5 = close/big)
    setZoom: function(zoom) {
        zoomOverride = zoom;
    },
    // Reset to auto depth scaling
    resetZoom: function() {
        zoomOverride = 0;
    },
    // AI-controllable blink/teleport to position
    blinkTo: function(x, y) {
        if (!isTeleporting) {
            isTeleporting = true;
            teleportPhase = 0;
            teleportTargetX = x;
            teleportTargetY = y;
        }
    },
    // Keyboard visibility — robot stays above keyboard at all times
    setKeyboardVisible: function(visible, keyboardTop) {
        keyboardVisible = visible;
        keyboardTopY = keyboardTop;
        if (visible) {
            // Immediately move robot above keyboard
            robotScreenY = keyboardTop - robotSize * 0.8;
            if (window.JSBridge) JSBridge.onRobotPosition(robotScreenX, robotScreenY, robotSize * currentScale);
        }
    },
    // Voice pipeline states
    startListening: function() {
        currentState = STATES.LISTENING;
        currentExpression = EXPRESSIONS.EXCITED;
        stateTimer = 0;
        updateExpression();
    },
    stopListening: function() {
        currentState = STATES.THINKING;
        currentExpression = EXPRESSIONS.THINKING;
        thinkingGroup.visible = true;
        stateTimer = 0;
        updateExpression();
    },
    startRecording: function() {
        currentState = STATES.RECORDING;
        currentExpression = EXPRESSIONS.EXCITED;
        stateTimer = 0;
        updateExpression();
    },
    stopRecording: function() {
        currentState = STATES.THINKING;
        currentExpression = EXPRESSIONS.THINKING;
        thinkingGroup.visible = true;
        stateTimer = 0;
        // Reset glow ring colors to cyan
        glowRing.material.color.setHex(0x00e5cc);
        glowRing2.material.color.setHex(0x00b8a0);
        robot.rotation.x = 0;
        updateExpression();
    },
    getVersion: function() { return '5.3'; },
    // Privacy mode — hands cover eyes when a blocked app is open
    hideEyes: function() {
        currentExpression = EXPRESSIONS.HIDING_EYES;
        handsVisible = true;
        updateExpression();
    },
    // Stop hiding eyes — return to normal
    showEyes: function() {
        if (currentExpression === EXPRESSIONS.HIDING_EYES) {
            currentExpression = EXPRESSIONS.NEUTRAL;
            handsVisible = false;
            currentState = STATES.IDLE;
            stateDuration = 3;
            updateExpression();
        }
    },
    setStandby: function(val) {
        standbyMode = val;
        if (val) {
            // Stop any current walking, go to idle
            currentState = STATES.IDLE;
            currentExpression = EXPRESSIONS.SLEEPING;
            stateDuration = 999;
            userActive = false; // stop dancing in standby
            updateExpression();
        } else {
            // Wake up
            currentState = STATES.IDLE;
            currentExpression = EXPRESSIONS.NEUTRAL;
            stateDuration = 3;
            updateExpression();
        }
    },
    // Start dancing — called when user activity is detected
    startDancing: function() {
        if (standbyMode) return;
        userActive = true;
        lastActivityTime = animTime;
        if (currentState !== STATES.DANCING && currentState !== STATES.THINKING &&
            currentState !== STATES.TALKING && currentState !== STATES.LISTENING &&
            currentState !== STATES.RECORDING && !isDragging) {
            currentState = STATES.DANCING;
            danceBeatTimer = 0;
            danceMoveIndex = 0;
            danceBlinkTimer = 0;
            // Randomize tempo
            danceBeatInterval = 0.35 + Math.random() * 0.25; // 100-170 BPM
            currentExpression = EXPRESSIONS.EXCITED;
            updateExpression();
        }
    },
    // Stop dancing — return to idle
    stopDancing: function() {
        userActive = false;
        if (currentState === STATES.DANCING) {
            currentState = STATES.IDLE;
            stateDuration = 3;
            currentExpression = EXPRESSIONS.NEUTRAL;
            updateExpression();
        }
    },
    // Notify that user is active (app switch, touch, etc.)
    onUserActivity: function() {
        if (standbyMode) return;
        lastActivityTime = animTime;
        if (!userActive) {
            startDancing();
        }
    },
    // Turn 180 degrees to "look at" the screen (show back to user)
    lookAtScreen: function() {
        if (!isTurning) {
            isTurning = true;
            turnPhase = 0;
            turnTimer = 0;
            turnTargetY = Math.PI; // 180 degrees
        }
    },
    // Play a sequence of expressions with durations
    // sequenceJson format: [{"expr":"HAPPY","duration":1.5},{"expr":"SURPRISED","duration":1.0},...]
    playExpressionSequence: function(sequenceJson) {
        try {
            var seq = JSON.parse(sequenceJson);
            if (seq && seq.length > 0) {
                expressionSequence = seq;
                sequenceIndex = 0;
                sequenceTimer = 0;
                sequenceActive = true;
                // Apply first expression immediately (case-insensitive)
                if (seq[0].expr) {
                    var upper = String(seq[0].expr).toUpperCase().trim();
                    if (EXPRESSIONS[upper]) {
                        currentExpression = EXPRESSIONS[upper];
                        updateExpression();
                    }
                }
            }
        } catch(e) {
            // ignore parse errors
        }
    },
    // Stop any running expression sequence
    stopSequence: function() {
        sequenceActive = false;
        expressionSequence = [];
        sequenceIndex = 0;
    }
};

// ── Hand Gesture System ──
// The AI sends [TOOL:HAND:gesture] with every response to control hand poses.
// Each gesture sets hand positions, rotations, and visibility.
// If the gesture is NONE, hands hide. Otherwise hands are always visible.
function applyHandGesture(gesture) {
    // fingerCurl: 0 = fully open, 1 = fully clenched fist.
    // Applied per-finger in the animate loop by rotating proximal + distal
    // joint groups. Some gestures override individual fingers (e.g. POINT
    // keeps index extended, PEACE keeps index + middle extended).
    switch (gesture) {
        case 'NONE':
            handsVisible = false;
            targetFingerCurl = [0, 0, 0, 0]; targetThumbCurl = 0;
            break;
        case 'WAVE':
            // Both hands waving down low — friendly greeting, open hand
            handsVisible = true;
            leftHandTargetX = -1.2; leftHandTargetY = -1.0; leftHandTargetZ = 0.9;
            leftHandTargetRotX = 0.3; leftHandTargetRotY = 0; leftHandTargetRotZ = 0.4;
            rightHandTargetX = 1.2; rightHandTargetY = -1.0; rightHandTargetZ = 0.9;
            rightHandTargetRotX = 0.3; rightHandTargetRotY = 0; rightHandTargetRotZ = -0.4;
            targetFingerCurl = [0, 0, 0, 0]; targetThumbCurl = 0;
            break;
        case 'POINT':
            // Right hand pointing forward, left hand down
            // Index extended, other fingers curled
            handsVisible = true;
            leftHandTargetX = -0.85; leftHandTargetY = -1.35; leftHandTargetZ = 0.9;
            leftHandTargetRotX = 0; leftHandTargetRotY = 0; leftHandTargetRotZ = 0;
            rightHandTargetX = 0.9; rightHandTargetY = 0.0; rightHandTargetZ = 1.2;
            rightHandTargetRotX = -0.3; rightHandTargetRotY = 0; rightHandTargetRotZ = 0;
            targetFingerCurl = [0, 0.9, 0.9, 0.9]; targetThumbCurl = 0.5;
            break;
        case 'FIST':
            // Both hands clenched forward — determined/angry, all fingers curled
            handsVisible = true;
            leftHandTargetX = -1.0; leftHandTargetY = -0.3; leftHandTargetZ = 0.9;
            leftHandTargetRotX = 0; leftHandTargetRotY = 0.3; leftHandTargetRotZ = 0;
            rightHandTargetX = 1.0; rightHandTargetY = -0.3; rightHandTargetZ = 0.9;
            rightHandTargetRotX = 0; rightHandTargetRotY = -0.3; rightHandTargetRotZ = 0;
            targetFingerCurl = [1, 1, 1, 1]; targetThumbCurl = 0.8;
            break;
        case 'OPEN':
            // Both hands open palms forward — welcoming, all fingers extended
            handsVisible = true;
            leftHandTargetX = -1.0; leftHandTargetY = -0.5; leftHandTargetZ = 1.0;
            leftHandTargetRotX = -0.2; leftHandTargetRotY = 0.3; leftHandTargetRotZ = 0;
            rightHandTargetX = 1.0; rightHandTargetY = -0.5; rightHandTargetZ = 1.0;
            rightHandTargetRotX = -0.2; rightHandTargetRotY = -0.3; rightHandTargetRotZ = 0;
            targetFingerCurl = [0, 0, 0, 0]; targetThumbCurl = 0;
            break;
        case 'HEART':
            // Both hands form heart shape in front of chest, fingers curled
            handsVisible = true;
            leftHandTargetX = -0.4; leftHandTargetY = -0.2; leftHandTargetZ = 1.0;
            leftHandTargetRotX = 0; leftHandTargetRotY = 0.6; leftHandTargetRotZ = 0.5;
            rightHandTargetX = 0.4; rightHandTargetY = -0.2; rightHandTargetZ = 1.0;
            rightHandTargetRotX = 0; rightHandTargetRotY = -0.6; rightHandTargetRotZ = -0.5;
            targetFingerCurl = [0.7, 0.7, 0.7, 0.7]; targetThumbCurl = 0.7;
            break;
        case 'THUMBS_UP':
            // Right hand thumbs up, left hand down
            // Thumb extended, all fingers curled
            handsVisible = true;
            leftHandTargetX = -0.85; leftHandTargetY = -1.35; leftHandTargetZ = 0.9;
            leftHandTargetRotX = 0; leftHandTargetRotY = 0; leftHandTargetRotZ = 0;
            rightHandTargetX = 1.0; rightHandTargetY = 0.1; rightHandTargetZ = 1.0;
            rightHandTargetRotX = -0.5; rightHandTargetRotY = 0; rightHandTargetRotZ = 0;
            targetFingerCurl = [1, 1, 1, 1]; targetThumbCurl = 0;
            break;
        case 'PEACE':
            // Right hand peace sign (V), left hand down
            // Index + middle extended, ring + pinky curled
            handsVisible = true;
            leftHandTargetX = -0.85; leftHandTargetY = -1.35; leftHandTargetZ = 0.9;
            leftHandTargetRotX = 0; leftHandTargetRotY = 0; leftHandTargetRotZ = 0;
            rightHandTargetX = 0.9; rightHandTargetY = 0.2; rightHandTargetZ = 1.1;
            rightHandTargetRotX = -0.3; rightHandTargetRotY = 0; rightHandTargetRotZ = 0.3;
            targetFingerCurl = [0, 0, 0.9, 0.9]; targetThumbCurl = 0.5;
            break;
        case 'THINK':
            // Right hand on chin — thinking pose, fingers relaxed
            handsVisible = true;
            leftHandTargetX = -0.85; leftHandTargetY = -1.35; leftHandTargetZ = 0.9;
            leftHandTargetRotX = 0; leftHandTargetRotY = 0; leftHandTargetRotZ = 0;
            rightHandTargetX = 0.3; rightHandTargetY = 0.1; rightHandTargetZ = 1.0;
            rightHandTargetRotX = 0.2; rightHandTargetRotY = 0.5; rightHandTargetRotZ = 0.3;
            targetFingerCurl = [0.3, 0.3, 0.3, 0.3]; targetThumbCurl = 0.2;
            break;
        case 'BELLY':
            // Both hands on belly — laughing, content, fingers relaxed
            handsVisible = true;
            leftHandTargetX = -0.5; leftHandTargetY = -0.6; leftHandTargetZ = 0.9;
            leftHandTargetRotX = 0.3; leftHandTargetRotY = 0.4; leftHandTargetRotZ = 0.2;
            rightHandTargetX = 0.5; rightHandTargetY = -0.6; rightHandTargetZ = 0.9;
            rightHandTargetRotX = 0.3; rightHandTargetRotY = -0.4; rightHandTargetRotZ = -0.2;
            targetFingerCurl = [0.4, 0.4, 0.4, 0.4]; targetThumbCurl = 0.3;
            break;
        case 'CHEEKS':
            // Both hands on cheeks — surprised, shock, fingers spread
            handsVisible = true;
            leftHandTargetX = -1.0; leftHandTargetY = -0.2; leftHandTargetZ = 0.9;
            leftHandTargetRotX = 0; leftHandTargetRotY = 0.5; leftHandTargetRotZ = 0;
            rightHandTargetX = 1.0; rightHandTargetY = -0.2; rightHandTargetZ = 0.9;
            rightHandTargetRotX = 0; rightHandTargetRotY = -0.5; rightHandTargetRotZ = 0;
            targetFingerCurl = [0, 0, 0, 0]; targetThumbCurl = 0;
            break;
        case 'DOWN':
            // Both hands hanging down low — sad, relaxed, fingers loose
            handsVisible = true;
            leftHandTargetX = -1.1; leftHandTargetY = -1.1; leftHandTargetZ = 0.5;
            leftHandTargetRotX = 0.5; leftHandTargetRotY = 0; leftHandTargetRotZ = 0.2;
            rightHandTargetX = 1.1; rightHandTargetY = -1.1; rightHandTargetZ = 0.5;
            rightHandTargetRotX = 0.5; rightHandTargetRotY = 0; rightHandTargetRotZ = -0.2;
            targetFingerCurl = [0.2, 0.2, 0.2, 0.2]; targetThumbCurl = 0.1;
            break;
        case 'RAISED':
            // Both hands raised up high — excited, celebrating, open hands
            handsVisible = true;
            leftHandTargetX = -1.1; leftHandTargetY = 0.5; leftHandTargetZ = 0.9;
            leftHandTargetRotX = -0.6; leftHandTargetRotY = 0; leftHandTargetRotZ = 0.3;
            rightHandTargetX = 1.1; rightHandTargetY = 0.5; rightHandTargetZ = 0.9;
            rightHandTargetRotX = -0.6; rightHandTargetRotY = 0; rightHandTargetRotZ = -0.3;
            targetFingerCurl = [0, 0, 0, 0]; targetThumbCurl = 0;
            break;
        case 'CLAP':
            // Both hands together in front — clapping, praising, fingers spread
            handsVisible = true;
            leftHandTargetX = -0.25; leftHandTargetY = -0.4; leftHandTargetZ = 1.0;
            leftHandTargetRotX = 0; leftHandTargetRotY = 0.5; leftHandTargetRotZ = 0;
            rightHandTargetX = 0.25; rightHandTargetY = -0.4; rightHandTargetZ = 1.0;
            rightHandTargetRotX = 0; rightHandTargetRotY = -0.5; rightHandTargetRotZ = 0;
            targetFingerCurl = [0, 0, 0, 0]; targetThumbCurl = 0;
            break;
        case 'SHRUG':
            // Both hands out to sides, palms up — "I don't know", open
            handsVisible = true;
            leftHandTargetX = -1.3; leftHandTargetY = -0.1; leftHandTargetZ = 0.7;
            leftHandTargetRotX = -0.3; leftHandTargetRotY = 0.5; leftHandTargetRotZ = 0.3;
            rightHandTargetX = 1.3; rightHandTargetY = -0.1; rightHandTargetZ = 0.7;
            rightHandTargetRotX = -0.3; rightHandTargetRotY = -0.5; rightHandTargetRotZ = -0.3;
            targetFingerCurl = [0.1, 0.1, 0.1, 0.1]; targetThumbCurl = 0;
            break;
        case 'SCRATCH':
            // Right hand scratching head — confused, fingers curled
            handsVisible = true;
            leftHandTargetX = -0.85; leftHandTargetY = -1.35; leftHandTargetZ = 0.9;
            leftHandTargetRotX = 0; leftHandTargetRotY = 0; leftHandTargetRotZ = 0;
            rightHandTargetX = 0.5; rightHandTargetY = 0.8; rightHandTargetZ = 0.9;
            rightHandTargetRotX = 0.3; rightHandTargetRotY = 0; rightHandTargetRotZ = 0.4;
            targetFingerCurl = [0.6, 0.6, 0.6, 0.6]; targetThumbCurl = 0.4;
            break;
        case 'TREMBLE':
            // Both hands trembling down low — scared, nervous, fingers curled
            handsVisible = true;
            leftHandTargetX = -1.2; leftHandTargetY = -0.8; leftHandTargetZ = 0.5;
            leftHandTargetRotX = 0.5; leftHandTargetRotY = 0; leftHandTargetRotZ = 0.3;
            rightHandTargetX = 1.2; rightHandTargetY = -0.8; rightHandTargetZ = 0.5;
            rightHandTargetRotX = 0.5; rightHandTargetRotY = 0; rightHandTargetRotZ = -0.3;
            targetFingerCurl = [0.7, 0.7, 0.7, 0.7]; targetThumbCurl = 0.6;
            break;
        case 'REST':
            // Default resting position — hands at bottom, fingers relaxed
            handsVisible = true;
            leftHandTargetX = -0.85; leftHandTargetY = -1.35; leftHandTargetZ = 0.9;
            leftHandTargetRotX = 0; leftHandTargetRotY = 0; leftHandTargetRotZ = 0;
            rightHandTargetX = 0.85; rightHandTargetY = -1.35; rightHandTargetZ = 0.9;
            rightHandTargetRotX = 0; rightHandTargetRotY = 0; rightHandTargetRotZ = 0;
            targetFingerCurl = [0.15, 0.15, 0.15, 0.15]; targetThumbCurl = 0.1;
            break;
        default:
            // Unknown gesture — keep current hand state
            break;
    }
}

// ── Expression system ──
function updateExpression() {
    switch (currentExpression) {
        case EXPRESSIONS.NEUTRAL:
            targetLeftEyeScaleX = 1; targetLeftEyeScaleY = 1;
            targetRightEyeScaleX = 1; targetRightEyeScaleY = 1;
            targetLeftEyePosY = 0.15; targetRightEyePosY = 0.15;
            targetMouthScaleX = 1; targetMouthScaleY = 1;
            targetMouthPosY = -0.45; targetMouthRotation = 0;
            targetHeadTilt = 0; targetHeadTiltZ = 0;
            targetGlowOpacity = 0.3;
            targetEyeColor.setHex(0x00e5cc);
            targetMouthColor.setHex(0x00e5cc);
            break;

        case EXPRESSIONS.HAPPY:
            targetLeftEyeScaleX = 1; targetLeftEyeScaleY = 0.6;
            targetRightEyeScaleX = 1; targetRightEyeScaleY = 0.6;
            targetLeftEyePosY = 0.22; targetRightEyePosY = 0.22;
            targetMouthScaleX = 1.3; targetMouthScaleY = 1;
            targetMouthPosY = -0.42; targetMouthRotation = 0;

            targetGlowOpacity = 0.4;

            targetMouthColor.setHex(0x00ff99);

        case EXPRESSIONS.THINKING:
            targetLeftEyeScaleX = 1; targetLeftEyeScaleY = 0.5;
            targetRightEyeScaleX = 1; targetRightEyeScaleY = 1;
            targetLeftEyePosY = 0.18; targetRightEyePosY = 0.15;
            targetMouthScaleX = 0.7; targetMouthScaleY = 0.8;
            targetMouthPosY = -0.48; targetMouthRotation = 0.1;
            targetHeadTilt = 0.15; targetHeadTiltZ = 0;
            targetGlowOpacity = 0.35;
